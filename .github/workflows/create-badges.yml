name: Create Badges

# Self-rendered SVG status badges committed to an orphan `badges` branch. There is
# NO third-party render service (no shields.io, no codecov). The value is baked
# into the committed SVG at creation time, so the badge keeps rendering with
# nothing live behind it.
#
# The coverage badge is a DUMB READER: it reads a percentage out of a file and
# renders it. It does NOT run tests, set up Go, or compute anything -- producing
# that number is 100% your pipeline's job. Point it at a file your own pipeline
# produced (default: downloaded from the `coverage` artifact, file `coverage.txt`,
# which must contain the percentage). If the coverage badge is enabled and the
# file is missing, the job FAILS.
#
# Caller (coverage value delivered via an artifact an earlier job uploaded):
#
#   jobs:
#     badges:
#       needs: [call-go-workflow]         # so the coverage artifact exists
#       if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
#       permissions:
#         contents: write
#       uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
#       with:
#         coverage: true
#
# README embeds (raw, GitHub-hosted, no external service):
#   ![coverage](https://raw.githubusercontent.com/<owner>/<repo>/badges/coverage.svg)
#   ![license](https://raw.githubusercontent.com/<owner>/<repo>/badges/license.svg)
#   ![version](https://raw.githubusercontent.com/<owner>/<repo>/badges/version.svg)

on:
  workflow_call:
    inputs:
      coverage:
        description: "Generate the coverage badge by reading a percentage from a file"
        required: false
        default: false
        type: boolean
      coverage_artifact:
        description: "Artifact to download the coverage file from (empty = file is already in the checkout/workspace)"
        required: false
        default: "coverage"
        type: string
      coverage_file:
        description: "Path to the file containing the coverage percentage"
        required: false
        default: "coverage-percent.txt"
        type: string
      license:
        description: "Generate the license badge (repo's SPDX id from the GitHub API)"
        required: false
        default: true
        type: boolean
      version:
        description: "Generate the version badge (latest SemVer tag)"
        required: false
        default: true
        type: boolean
      badges_branch:
        description: "Branch the generated SVGs are committed to"
        required: false
        default: "badges"
        type: string
      runs_on:
        description: "Runner to use"
        required: false
        default: "ubuntu-latest"
        type: string

concurrency:
  # Branch and tag callers both write this mutable output branch. Serialize
  # them by caller repository and output branch rather than triggering ref.
  group: create-badges-${{ github.repository }}-${{ inputs.badges_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  create-badges:
    name: Create Badges
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        if: inputs.coverage && inputs.coverage_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.coverage_artifact }}

      - name: Render badges
        env:
          DO_COVERAGE: ${{ inputs.coverage }}
          DO_LICENSE: ${{ inputs.license }}
          DO_VERSION: ${{ inputs.version }}
          COVERAGE_FILE: ${{ inputs.coverage_file }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/badges"
          mkdir -p "$out"

          xml_escape() {
            local s="$1"
            s="${s//&/&amp;}"; s="${s//</&lt;}"; s="${s//>/&gt;}"; s="${s//\"/&quot;}"
            printf '%s' "$s"
          }

          # mkbadge <label> <message> <color-hex> <outfile> -- flat SVG, ~7px/char
          # (slight over-estimate so text never overflows) + 10px padding each side.
          mkbadge() {
            local label msg color file le me lw mw w lx mx
            label="$1"; msg="$2"; color="$3"; file="$4"
            le="$(xml_escape "$label")"; me="$(xml_escape "$msg")"
            lw=$(( ${#label} * 7 + 10 )); mw=$(( ${#msg} * 7 + 10 )); w=$(( lw + mw ))
            lx=$(( lw / 2 )); mx=$(( lw + mw / 2 ))
            printf '<svg xmlns="http://www.w3.org/2000/svg" width="%s" height="20" role="img" aria-label="%s: %s"><title>%s: %s</title><linearGradient id="s" x2="0" y2="100%%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="%s" height="20" rx="3" fill="#fff"/></clipPath><g clip-path="url(#r)"><rect width="%s" height="20" fill="#555"/><rect x="%s" width="%s" height="20" fill="%s"/><rect width="%s" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text><text x="%s" y="14">%s</text><text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text><text x="%s" y="14">%s</text></g></svg>\n' \
              "$w" "$le" "$me" "$le" "$me" "$w" "$lw" "$lw" "$mw" "$color" "$w" "$lx" "$le" "$lx" "$le" "$mx" "$me" "$mx" "$me" > "$file"
            echo "rendered $file  ($label: $msg)"
          }

          if [ "$DO_COVERAGE" = "true" ]; then
            if [ ! -f "$COVERAGE_FILE" ]; then
              echo "::error::coverage badge enabled but '$COVERAGE_FILE' not found -- your pipeline must produce it (and upload it as the coverage artifact)" >&2
              exit 1
            fi
            pct="$(grep -oE '[0-9]+(\.[0-9]+)?' "$COVERAGE_FILE" | head -n1 || true)"
            if [ -z "$pct" ]; then
              echo "::error::no numeric coverage value found in '$COVERAGE_FILE'" >&2
              exit 1
            fi
            int="${pct%.*}"
            if   [ "$int" -ge 90 ]; then color="#4c1"
            elif [ "$int" -ge 80 ]; then color="#97ca00"
            elif [ "$int" -ge 70 ]; then color="#dfb317"
            elif [ "$int" -ge 50 ]; then color="#fe7d37"
            else color="#e05d44"; fi
            mkbadge "coverage" "${pct}%" "$color" "$out/coverage.svg"
          fi

          if [ "$DO_LICENSE" = "true" ]; then
            spdx="$(gh api "repos/${REPO}" --jq '.license.spdx_id' 2>/dev/null || echo Unknown)"
            case "$spdx" in ""|null|NOASSERTION) spdx="Unknown" ;; esac
            mkbadge "license" "$spdx" "#007ec6" "$out/license.svg"
          fi

          if [ "$DO_VERSION" = "true" ]; then
            tag="$(git tag --sort=-v:refname | head -n1)"
            [ -n "$tag" ] || tag="none"
            mkbadge "version" "$tag" "#007ec6" "$out/version.svg"
          fi

      - name: Publish to the badges branch
        env:
          BR: ${{ inputs.badges_branch }}
        run: |
          set -euo pipefail
          git config user.name "Ciprian Mandache"
          git config user.email "psyb0t@51k.eu"

          git fetch origin "$BR" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/$BR" >/dev/null; then
            git checkout -B "$BR" "origin/$BR"
          else
            git checkout --orphan "$BR"
          fi

          # The badges branch holds ONLY the generated SVGs.
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/badges/"*.svg .
          git add -A

          if git diff --cached --quiet; then
            echo "no badge changes -- nothing to publish"
            exit 0
          fi

          git commit -m "chore(badges): update [skip ci]"

          # Retried because the push is pure network, and a blip here silently
          # loses the badge update for that run. A non-fast-forward rejection
          # would not be helped by a retry, but the concurrency group already
          # serializes writers per repo and branch, so a competing writer is not
          # the expected failure here -- a flaky connection is.
          #
          # It still exits non-zero if the push never lands. A green run that
          # did not publish would leave the README pointing at a stale badge
          # while claiming success.
          attempt=1
          until git push origin "HEAD:$BR"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::badge push failed after 3 attempts" >&2
              exit 1
            fi

            delay=$((10 * (2 ** (attempt - 1))))
            echo "push attempt ${attempt} failed; retrying in ${delay}s" >&2
            sleep "${delay}"
            attempt=$((attempt + 1))
          done
