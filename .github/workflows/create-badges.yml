name: Create Badges

# Self-rendered SVG status badges committed to an orphan `badges` branch. There is
# NO third-party render service (no shields.io, no codecov). The value is baked
# into the committed SVG at creation time, so the badge keeps rendering with
# nothing live behind it.
#
# The coverage badge is a DUMB READER: it reads a percentage out of a file and
# renders it. It does NOT run tests, set up Go, or compute anything -- producing
# that number is 100% your pipeline's job. Point it at a file your own pipeline
# produced (default: downloaded from the `coverage` artifact, file `coverage.txt`,
# which must contain the percentage). If the coverage badge is enabled and the
# file is missing, the job FAILS.
#
# Caller (coverage value delivered via an artifact an earlier job uploaded):
#
#   jobs:
#     badges:
#       needs: [call-go-workflow]         # so the coverage artifact exists
#       if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
#       permissions:
#         contents: write
#       uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
#       with:
#         coverage: true
#
# The imported-by badge (Go modules, opt-in via `importers: true`) additionally
# writes importers.md next to the SVGs -- the backlink list grouped by
# repository and flagged by owner. Link the badge AT it, so the count is one
# click from the names:
#
#   [![imported by](https://raw.githubusercontent.com/<o>/<r>/badges/importers.svg)](https://github.com/<o>/<r>/blob/badges/importers.md)
#
# It scrapes pkg.go.dev, which has no API for this, so it FAILS the job rather
# than render a number it could not read -- on a schedule, a wrongly-rendered 0
# would overwrite a real count and still look like data.
#
# README embeds (raw, GitHub-hosted, no external service):
#   ![coverage](https://raw.githubusercontent.com/<owner>/<repo>/badges/coverage.svg)
#   ![license](https://raw.githubusercontent.com/<owner>/<repo>/badges/license.svg)
#   ![version](https://raw.githubusercontent.com/<owner>/<repo>/badges/version.svg)
#   ![imported by](https://raw.githubusercontent.com/<owner>/<repo>/badges/importers.svg)

on:
  workflow_call:
    inputs:
      coverage:
        description: "Generate the coverage badge by reading a percentage from a file"
        required: false
        default: false
        type: boolean
      coverage_artifact:
        description: "Artifact to download the coverage file from (empty = file is already in the checkout/workspace)"
        required: false
        default: "coverage"
        type: string
      coverage_file:
        description: "Path to the file containing the coverage percentage"
        required: false
        default: "coverage-percent.txt"
        type: string
      license:
        description: "Generate the license badge (repo's SPDX id from the GitHub API)"
        required: false
        default: true
        type: boolean
      version:
        description: "Generate the version badge (latest SemVer tag)"
        required: false
        default: true
        type: boolean
      importers:
        description: "Go modules only. Generate the imported-by badge + importers.md backlink list from pkg.go.dev"
        required: false
        default: false
        type: boolean
      importers_module:
        description: "Module path to look up (empty = github.com/<owner>/<repo>)"
        required: false
        default: ""
        type: string
      badges_branch:
        description: "Branch the generated SVGs are committed to"
        required: false
        default: "badges"
        type: string
      runs_on:
        description: "Runner to use"
        required: false
        default: "ubuntu-latest"
        type: string

concurrency:
  # Branch and tag callers both write this mutable output branch. Serialize
  # them by caller repository and output branch rather than triggering ref.
  group: create-badges-${{ github.repository }}-${{ inputs.badges_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  create-badges:
    name: Create Badges
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        if: inputs.coverage && inputs.coverage_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.coverage_artifact }}

      - name: Render badges
        env:
          DO_COVERAGE: ${{ inputs.coverage }}
          DO_LICENSE: ${{ inputs.license }}
          DO_VERSION: ${{ inputs.version }}
          DO_IMPORTERS: ${{ inputs.importers }}
          IMPORTERS_MODULE: ${{ inputs.importers_module }}
          COVERAGE_FILE: ${{ inputs.coverage_file }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/badges"
          mkdir -p "$out"

          xml_escape() {
            local s="$1"
            s="${s//&/&amp;}"; s="${s//</&lt;}"; s="${s//>/&gt;}"; s="${s//\"/&quot;}"
            printf '%s' "$s"
          }

          # mkbadge <label> <message> <color-hex> <outfile> -- flat SVG, ~7px/char
          # (slight over-estimate so text never overflows) + 10px padding each side.
          mkbadge() {
            local label msg color file le me lw mw w lx mx
            label="$1"; msg="$2"; color="$3"; file="$4"
            le="$(xml_escape "$label")"; me="$(xml_escape "$msg")"
            lw=$(( ${#label} * 7 + 10 )); mw=$(( ${#msg} * 7 + 10 )); w=$(( lw + mw ))
            lx=$(( lw / 2 )); mx=$(( lw + mw / 2 ))
            printf '<svg xmlns="http://www.w3.org/2000/svg" width="%s" height="20" role="img" aria-label="%s: %s"><title>%s: %s</title><linearGradient id="s" x2="0" y2="100%%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="%s" height="20" rx="3" fill="#fff"/></clipPath><g clip-path="url(#r)"><rect width="%s" height="20" fill="#555"/><rect x="%s" width="%s" height="20" fill="%s"/><rect width="%s" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text><text x="%s" y="14">%s</text><text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text><text x="%s" y="14">%s</text></g></svg>\n' \
              "$w" "$le" "$me" "$le" "$me" "$w" "$lw" "$lw" "$mw" "$color" "$w" "$lx" "$le" "$lx" "$le" "$mx" "$me" "$mx" "$me" > "$file"
            echo "rendered $file  ($label: $msg)"
          }

          if [ "$DO_COVERAGE" = "true" ]; then
            if [ ! -f "$COVERAGE_FILE" ]; then
              echo "::error::coverage badge enabled but '$COVERAGE_FILE' not found -- your pipeline must produce it (and upload it as the coverage artifact)" >&2
              exit 1
            fi
            pct="$(grep -oE '[0-9]+(\.[0-9]+)?' "$COVERAGE_FILE" | head -n1 || true)"
            if [ -z "$pct" ]; then
              echo "::error::no numeric coverage value found in '$COVERAGE_FILE'" >&2
              exit 1
            fi
            int="${pct%.*}"
            if   [ "$int" -ge 90 ]; then color="#4c1"
            elif [ "$int" -ge 80 ]; then color="#97ca00"
            elif [ "$int" -ge 70 ]; then color="#dfb317"
            elif [ "$int" -ge 50 ]; then color="#fe7d37"
            else color="#e05d44"; fi
            mkbadge "coverage" "${pct}%" "$color" "$out/coverage.svg"
          fi

          if [ "$DO_LICENSE" = "true" ]; then
            spdx="$(gh api "repos/${REPO}" --jq '.license.spdx_id' 2>/dev/null || echo Unknown)"
            case "$spdx" in ""|null|NOASSERTION) spdx="Unknown" ;; esac
            mkbadge "license" "$spdx" "#007ec6" "$out/license.svg"
          fi

          if [ "$DO_VERSION" = "true" ]; then
            tag="$(git tag --sort=-v:refname | head -n1)"
            [ -n "$tag" ] || tag="none"
            mkbadge "version" "$tag" "#007ec6" "$out/version.svg"
          fi

          if [ "$DO_IMPORTERS" = "true" ]; then
            mod="${IMPORTERS_MODULE:-github.com/$REPO}"
            url="https://pkg.go.dev/${mod}?tab=importedby"
            owner="${REPO%%/*}"

            # pkg.go.dev has no API for this; the count only exists in the HTML.
            # That makes every failure below indistinguishable from "nobody
            # imports it" unless we check explicitly -- and since this job runs
            # on a schedule, a wrongly-rendered 0 would OVERWRITE a real count
            # and look like data. So: fail loudly, keep the previously committed
            # badge, and never invent a number.
            if ! html="$(curl -sS --fail --location --max-time 30 "$url")"; then
              echo "::error::pkg.go.dev fetch failed for ${mod} -- keeping the existing badge" >&2
              exit 1
            fi

            # Confirms we are on the page we think we are BEFORE trusting a zero.
            if ! printf '%s' "$html" | grep -q 'Imported By'; then
              echo "::error::pkg.go.dev importedby markup changed -- refusing to render a count" >&2
              exit 1
            fi

            # The page states its own total in prose. Parsing that as well as
            # the links turns the scrape into a self-checking instrument: two
            # independent reads of the same page that must agree.
            declared="$(printf '%s' "$html" | grep -oiE '[0-9,]+ packages?' | head -1 | grep -oE '[0-9,]+' | tr -d ,)"
            if [ -z "$declared" ]; then
              echo "::error::could not read the declared package count -- refusing to render" >&2
              exit 1
            fi

            # The `@version` strip matters: the page links the module's own
            # current version as github.com/<mod>@vX.Y.Z, which a bare prefix
            # test reads as a third-party importer and inflates the count by one.
            mapfile -t raw < <(
              printf '%s' "$html" \
                | grep -oE 'href="/github\.com/[^"?#]+"' \
                | sed 's|href="/||; s|"||; s|@.*||' \
                | sort -u
            )

            # Drop self-references. Matched as literal prefixes, not regex --
            # a module path is full of dots.
            imps=()
            for p in "${raw[@]}"; do
              case "$p" in "$mod"|"$mod"/*) continue ;; esac
              imps+=("$p")
            done

            n="${#imps[@]}"

            # Disagreement means the selectors drifted from the markup. Render
            # nothing rather than a number that is quietly wrong -- the whole
            # point of a badge is that nobody re-derives it by hand.
            if [ "$n" -ne "$declared" ]; then
              echo "::error::extracted ${n} importers but the page declares ${declared} -- scrape drifted, refusing to render" >&2
              exit 1
            fi
            if [ "$n" -gt 0 ]; then color="#007ec6"; else color="#9f9f9f"; fi
            mkbadge "imported by" "$n" "$color" "$out/importers.svg"

            # The backlink list. Grouped by repository because 55 raw package
            # paths is not something anyone reads, and flagged by owner because
            # WHO imports it decides how strictly the module has to be
            # versioned -- a count that is entirely your own fleet means "I use
            # my own library", not that the public depends on it.
            {
              printf '# Imported by\n\n'
              printf '`%s` is imported by **%s package(s)**.\n\n' "$mod" "$n"
              printf 'Generated from [pkg.go.dev](%s). Lists only PUBLIC packages that\n' "$url"
              printf 'pkg.go.dev has crawled -- private and uncrawled importers are invisible here,\n'
              printf 'and the crawl lags publication by days.\n\n'

              if [ "$n" -eq 0 ]; then
                printf 'No importers found.\n'
              else
                ext="$(printf '%s\n' "${imps[@]}" | awk -F/ -v o="$owner" '$2 != o' | wc -l)"
                printf '**%s** of them are outside `%s`.\n\n' "$ext" "$owner"
                printf '| repository | packages | |\n|---|---:|---|\n'
                printf '%s\n' "${imps[@]}" \
                  | awk -F/ -v o="$owner" '
                      { r = $1"/"$2"/"$3; c[r]++; if ($2 != o) x[r] = 1 }
                      END { for (k in c) printf "%d\t%s\t%s\n", c[k], k, (k in x ? "external" : "") }
                    ' \
                  | sort -rn \
                  | while IFS=$'\t' read -r cnt repo flag; do
                      printf '| [%s](https://%s) | %s | %s |\n' "${repo#github.com/}" "$repo" "$cnt" "$flag"
                    done
              fi
            } > "$out/importers.md"

            echo "rendered $out/importers.md  (${n} packages)"
          fi

      - name: Publish to the badges branch
        env:
          BR: ${{ inputs.badges_branch }}
        run: |
          set -euo pipefail
          git config user.name "Ciprian Mandache"
          git config user.email "psyb0t@51k.eu"

          git fetch origin "$BR" 2>/dev/null || true
          if git rev-parse --verify --quiet "origin/$BR" >/dev/null; then
            git checkout -B "$BR" "origin/$BR"
          else
            git checkout --orphan "$BR"
          fi

          # The badges branch holds ONLY generated artifacts.
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/badges/"*.svg .
          # intentional: importers.md is the only .md ever produced here, and it
          # exists only when the importers badge is enabled. Its absence is the
          # normal case, not a failure.
          cp "$RUNNER_TEMP/badges/"*.md . 2>/dev/null || true
          git add -A

          if git diff --cached --quiet; then
            echo "no badge changes -- nothing to publish"
            exit 0
          fi

          git commit -m "chore(badges): update [skip ci]"

          # Retried because the push is pure network, and a blip here silently
          # loses the badge update for that run. A non-fast-forward rejection
          # would not be helped by a retry, but the concurrency group already
          # serializes writers per repo and branch, so a competing writer is not
          # the expected failure here -- a flaky connection is.
          #
          # It still exits non-zero if the push never lands. A green run that
          # did not publish would leave the README pointing at a stale badge
          # while claiming success.
          attempt=1
          until git push origin "HEAD:$BR"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::badge push failed after 3 attempts" >&2
              exit 1
            fi

            delay=$((10 * (2 ** (attempt - 1))))
            echo "push attempt ${attempt} failed; retrying in ${delay}s" >&2
            sleep "${delay}"
            attempt=$((attempt + 1))
          done
