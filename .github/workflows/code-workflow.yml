name: Code Workflow

# SECURITY: build_command, lint_command, test_command, sec_command and
# generate_command run as shell on the runner (bash -eo pipefail -c). Callers
# control these strings and effectively get arbitrary code execution on the runner with
# whatever secrets/permissions the caller workflow grants. Only call this
# workflow from trusted repos with branch protection on the workflow files.
#
# This flow is a dumb command runner. It knows nothing about Go or any language.
# It runs the commands you pass (which do the real work in the repo's own
# dev-image via docker-in-docker), uploads the coverage file for the badge job,
# and uploads the sec SARIF to the Security tab. The toolchain and every tool
# version live in the repo's Makefile / dev-image, never here. No language setup,
# no version pins, no release.
#
# DISABLING A STEP: every *_command accepts "-" (preferred) or "" to skip it.
# "-" is the documented form because an empty string in a caller's YAML is
# indistinguishable from a templating accident, while "-" reads as a deliberate
# opt-out.

on:
  workflow_call:
    inputs:
      build_command:
        description: "Command that compiles the repo (e.g. 'make build'). Runs FIRST and gates the rest: if it fails, lint/test/sec/generate are skipped. '' or '-' skips it."
        required: false
        default: ""
        type: string
      lint_command:
        description: "Lint command (e.g. 'make lint'). '' or '-' skips it."
        required: false
        default: ""
        type: string
      test_command:
        description: "Test command (e.g. 'make test-coverage'). '' or '-' skips it."
        required: false
        default: ""
        type: string
      sec_command:
        description: "Security scan command (e.g. 'make sec'). It should write a SARIF to sarif_file for upload. '' or '-' skips it."
        required: false
        default: ""
        type: string
      generate_command:
        description: "Codegen command (e.g. 'make generate'). Just runs the generators; the flow then fails on git drift (a committed generated file that no longer matches). Ordered LAST because it rewrites the tree. '' or '-' skips it."
        required: false
        default: ""
        type: string
      coverage_file:
        description: "Path the test command wrote, containing just the coverage percentage. If set, uploaded as coverage_artifact for the badge job."
        required: false
        default: ""
        type: string
      coverage_artifact:
        description: "Artifact name for coverage_file (matches what create-badges downloads)."
        required: false
        default: "coverage"
        type: string
      sarif_file:
        description: "Path the sec command wrote SARIF to. If set, uploaded to Security > Code scanning. Needs security-events: write on the caller job."
        required: false
        default: ""
        type: string
      sarif_category:
        description: "Code-scanning category, so multiple legs (go, python) in one repo do not overwrite each other in the Security tab."
        required: false
        default: "code"
        type: string
      max_attempts:
        description: "Attempts per command before the step fails, including the first. Applies to build, lint, test, sec and the generator, so a runner network blip (a DNS failure during an image build, a registry timeout) is retried instead of failing the run. 1 turns retries off."
        required: false
        default: 5
        type: number
      backoff_seconds:
        description: "Delay before the second attempt, doubling each retry. With the default 5 attempts that is 30s, 60s, 120s, 240s between them."
        required: false
        default: 30
        type: number
      runs_on:
        description: "Runner to use (e.g. ubuntu-latest, self-hosted)."
        required: false
        default: "ubuntu-latest"
        type: string
      debug:
        description: "Emit a debug job that prints the workflow context and inputs."
        required: false
        default: false
        type: boolean

# The event name keeps a scheduled or manual run from cancelling the push run
# on the same ref, which a tag release waits for through
# wait-for-default-branch.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  debug-workflow:
    name: Debug Info
    runs-on: ${{ inputs.runs_on }}
    permissions: {}
    if: inputs.debug
    steps:
      - name: Debug context
        run: |
          echo "::group::Context"
          echo "github.ref: ${{ github.ref }}"
          echo "github.sha: ${{ github.sha }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "::endgroup::"
          echo "::group::Commands"
          echo "build_command: ${{ inputs.build_command }}"
          echo "lint_command: ${{ inputs.lint_command }}"
          echo "test_command: ${{ inputs.test_command }}"
          echo "sec_command: ${{ inputs.sec_command }}"
          echo "generate_command: ${{ inputs.generate_command }}"
          echo "max_attempts: ${{ inputs.max_attempts }} (backoff ${{ inputs.backoff_seconds }}s, doubling)"
          echo "coverage_file: ${{ inputs.coverage_file }}"
          echo "sarif_file: ${{ inputs.sarif_file }} (category ${{ inputs.sarif_category }})"
          echo "::endgroup::"

  code:
    name: Code
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      security-events: write # upload the sec SARIF to the repo Security tab
      # Do NOT add `actions: read` here. codeql upload-sarif wants it to attach
      # run metadata (a cosmetic annotation appears without it on private repos),
      # but a reusable job may only request permissions the CALLER grants, so
      # declaring it breaks every caller that does not grant it with an
      # invalid-workflow error. The SARIF still uploads either way.
    env:
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      BACKOFF_SECONDS: ${{ inputs.backoff_seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # One helper for every command step. A runner's network can drop for a
      # moment (DNS during an image build, a registry timeout), and a single
      # blip used to fail the whole run and any tag release waiting on it.
      # Each command reaches the helper through the environment, not through
      # the script text, and runs with bash -eo pipefail -c, so it keeps shell
      # syntax and stops at its first failing command as before.
      - name: Prepare retry helper
        run: |
          set -euo pipefail

          if ! [[ "${MAX_ATTEMPTS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_attempts must be a positive integer, got '${MAX_ATTEMPTS}'"
            exit 1
          fi

          if ! [[ "${BACKOFF_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "::error::backoff_seconds must be a non-negative integer, got '${BACKOFF_SECONDS}'"
            exit 1
          fi

          cat > "${RUNNER_TEMP}/run-with-retry.sh" <<'HELPER'
          # run_with_retry LABEL COMMAND: runs COMMAND with bash -eo pipefail
          # -c, the options GitHub gives a bash step, up to
          # MAX_ATTEMPTS times, sleeping BACKOFF_SECONDS before the second
          # attempt and doubling the delay after each failure. Returns the
          # last attempt's exit code.
          run_with_retry() {
            local label="$1"
            local command="$2"
            local attempt=1
            local delay="${BACKOFF_SECONDS}"
            local status

            while true; do
              echo "::group::${label}: attempt ${attempt} of ${MAX_ATTEMPTS}"
              set +e
              bash -eo pipefail -c "${command}"
              status=$?
              set -e
              echo "::endgroup::"

              if [ "${status}" -eq 0 ]; then
                return 0
              fi

              if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                echo "::error::${label} failed after ${attempt} attempt(s), last exit ${status}"
                return "${status}"
              fi

              echo "::warning::${label} failed on attempt ${attempt} with exit ${status}; retrying in ${delay}s"
              sleep "${delay}"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }
          HELPER

      # build is the gate: if the code does not compile, lint and test fail at the
      # same step anyway, so run it first and skip the rest when it fails.
      - name: Build
        id: build
        if: inputs.build_command != '' && inputs.build_command != '-'
        env:
          COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/run-with-retry.sh"
          run_with_retry Build "${COMMAND}"

      # Each step below runs when the build was green OR skipped (outcome is not
      # 'failure'), so one check failing does not hide the next, but all skip when
      # the build actually failed. That fails the run fast on the real problem.
      - name: Lint
        if: always() && steps.build.outcome != 'failure' && inputs.lint_command != '' && inputs.lint_command != '-'
        env:
          COMMAND: ${{ inputs.lint_command }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/run-with-retry.sh"
          run_with_retry Lint "${COMMAND}"

      - name: Test
        if: always() && steps.build.outcome != 'failure' && inputs.test_command != '' && inputs.test_command != '-'
        env:
          COMMAND: ${{ inputs.test_command }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/run-with-retry.sh"
          run_with_retry Test "${COMMAND}"

      - name: Upload coverage artifact
        if: always() && inputs.coverage_file != '' && hashFiles(inputs.coverage_file) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.coverage_artifact }}
          path: ${{ inputs.coverage_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Security scan
        if: always() && steps.build.outcome != 'failure' && inputs.sec_command != '' && inputs.sec_command != '-'
        env:
          COMMAND: ${{ inputs.sec_command }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/run-with-retry.sh"
          run_with_retry "Security scan" "${COMMAND}"

      # Upload whatever SARIF the sec command wrote, even when it gated the build,
      # so findings reach the Security tab either way. continue-on-error: the
      # upload 403s if the caller did not grant security-events: write, and that
      # must not fail an otherwise-green run.
      - name: Upload SARIF to the Security tab
        if: always() && inputs.sarif_file != '' && hashFiles(inputs.sarif_file) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: ${{ inputs.sarif_file }}
          category: ${{ inputs.sarif_category }}

      # generate runs LAST because it rewrites the tree; earlier and lint/test
      # would see regenerated code instead of the committed code. The command
      # just runs the generators (whatever they are: go, node, web); the drift
      # check is generic and lives here, not duplicated in every project.
      - name: Generate and check drift
        if: always() && steps.build.outcome != 'failure' && inputs.generate_command != '' && inputs.generate_command != '-'
        env:
          COMMAND: ${{ inputs.generate_command }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/run-with-retry.sh"

          # Only the generator retries. Drift is a real result, checked once.
          run_with_retry Generate "${COMMAND}"

          # git status --porcelain rather than git diff --exit-code: diff only
          # sees tracked files, so a generator emitting a NEW uncommitted file
          # would pass silently. Porcelain catches modified and untracked alike,
          # and still ignores anything in .gitignore.
          changes="$(git status --porcelain)"
          if [ -z "${changes}" ]; then
            echo "Generated files are up to date."
            exit 0
          fi

          echo "::error::Generated files are out of date. Run the generator locally and commit the result."
          echo "::group::Changed paths"
          echo "${changes}"
          echo "::endgroup::"
          echo "::group::Diff"
          git diff
          echo "::endgroup::"
          exit 1
