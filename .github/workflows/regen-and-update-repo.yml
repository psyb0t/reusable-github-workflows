name: Regen And Update Repo Workflow

# Regenerate, fix, describe, release. Runs the repo's own generate command;
# when the tree changes, runs the repo's checks. When they fail, Claude
# (through the psyb0t/docker-claudebox action) fixes the checkout and the
# checks run again, up to `fix_attempts` times, each attempt seeing every
# earlier failure. Then Claude describes, classifies and reviews the change,
# and the workflow commits, tags and pushes the result and publishes the
# release.
#
# Typical use: a generated API client refreshed on a schedule from a spec its
# upstream publishes. Nothing here knows about specs or languages; the Go
# exported-API comparison is an opt-in (`go_apidiff`) that only adds evidence
# for the description step.
#
# SECURITY: generate_command, check_commands and context_command run as shell
# on the runner, like the *_command inputs of code-workflow.yml. Callers
# control them; only call this from trusted repos with branch protection on
# the workflow files.
#
# Trust boundary around Claude:
#   - The fix attempts run in `regen`, which has `contents: read`, no GitHub
#     token in the checkout and only the Claude credential. Claude edits the
#     checkout; a guard (scripts/regen-fix.sh) rejects edits to
#     `fix_protected_paths`, added check suppressions (t.Skip, nolint,
#     nosemgrep, ...) and AI attribution, and the repo's checks must pass
#     afterwards. The patch released is built from that checked tree.
#   - `describe` runs claudebox with `contents: read` and only the Claude
#     credential. No GitHub token is passed in. Its input is a context
#     artifact (diff, stats, changelog head, reports), mounted read-only.
#   - Claude's output is treated as untrusted text. `release` validates every
#     file and falls back to a deterministic changelog entry, subject and
#     `fix` change kind when something is missing or malformed. The version is
#     computed by the workflow from the last tag; Claude only picks the kind.
#   - Only `release` can write to the repo, and it executes nothing Claude
#     wrote.
#
# Jobs:
#   regen          generate, detect changes, run checks, fix loop, build
#                  patch + context
#   describe       claudebox: changelog.md, subject.txt, change-kind.txt,
#                  bump-reason.txt, verdict.txt (ok or block: reason)
#   release        apply patch, validate, version, changelog, version files,
#                  commit, annotated tag, atomic push
#   github-release / clawhub
#                  call release-workflow.yml / clawhub-publish.yml with the new
#                  tag, because a tag pushed with GITHUB_TOKEN does not trigger
#                  the repo's own tag pipeline
#   report-failure scheduled runs only: open or update one issue
#
# Example caller:
#
#   on:
#     schedule:
#       - cron: "44 16 * * *"
#     workflow_dispatch:
#   jobs:
#     regen:
#       permissions:
#         contents: write
#         issues: write
#       uses: psyb0t/reusable-github-workflows/.github/workflows/regen-and-update-repo.yml@master
#       with:
#         go_apidiff: true
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      generate_command:
        description: "Command that regenerates the tracked files (e.g. 'make generate')."
        required: false
        default: "make generate"
        type: string
      check_commands:
        description: "Shell run after a change is detected, before anything is pushed (e.g. 'make lint && make test && make sec'). A failure stops the release. '' or '-' skips it."
        required: false
        default: "make lint && make test && make sec"
        type: string
      fix_attempts:
        description: "How many times Claude may fix the checkout when the checks fail (0 to 3). 0 turns the fix loop off: a failed check stops the run."
        required: false
        default: 3
        type: number
      fix_timeout_minutes:
        description: "Timeout for each fix attempt."
        required: false
        default: 30
        type: number
      fix_protected_paths:
        description: "Extended regex over repo-relative paths a fix attempt must not touch. A match fails the run."
        required: false
        default: "^(\\.github/|AGENTS\\.md$|\\.agents/rules/|\\.gitleaks|\\.golangci|\\.semgrep|scripts/(sec|lint)\\.sh$|CHANGELOG\\.md$)"
        type: string
      block_on_review:
        description: "Stop the release when the review verdict is 'block: <reason>', or when it is missing for a release that includes automated fixes."
        required: false
        default: true
        type: boolean
      context_command:
        description: "Optional shell whose stdout is given to the description step as context.txt (e.g. a grep for an upstream version line). A failure only warns."
        required: false
        default: ""
        type: string
      changelog_path:
        description: "Changelog the new entry is prepended to (above the first '## ' heading)."
        required: false
        default: "CHANGELOG.md"
        type: string
      version_files:
        description: "Whitespace-separated JSON files whose top-level \"version\" is set to the new version (e.g. a plugin manifest). Empty bumps none."
        required: false
        default: ""
        type: string
      allow_major:
        description: "At 1.0.0 or later, a 'breaking' change kind bumps major. Set false to bump minor instead. No effect before 1.0.0, where breaking always bumps minor."
        required: false
        default: true
        type: boolean
      go_apidiff:
        description: "Compare the Go module's exported API between the last tag and the regenerated tree (golang.org/x/exp/cmd/apidiff) and give the report to the description step."
        required: false
        default: false
        type: boolean
      go_module:
        description: "Go module path for apidiff. Empty reads it from go.mod."
        required: false
        default: ""
        type: string
      go_version_file:
        description: "File setup-go reads the Go version from, for apidiff."
        required: false
        default: "go.mod"
        type: string
      apidiff_version:
        description: "EXACT golang.org/x/exp version apidiff is installed from."
        required: false
        default: "v0.0.0-20260908205506-85c1c2202aba"
        type: string
      max_diff_bytes:
        description: "Truncate the diff handed to the description step at this size."
        required: false
        default: 200000
        type: number
      max_changelog_bytes:
        description: "Reject a generated changelog entry larger than this (fallback is used)."
        required: false
        default: 4000
        type: number
      claude_model:
        description: "claudebox --model. Empty uses Claude Code's default."
        required: false
        default: ""
        type: string
      claude_timeout_minutes:
        description: "Timeout for the describe job."
        required: false
        default: 20
        type: number
      github_release:
        description: "Cut a GitHub release for the new tag (release-workflow.yml)."
        required: false
        default: true
        type: boolean
      clawhub_publish:
        description: "Publish to ClawHub for the new tag (clawhub-publish.yml). Needs the CLAWHUB_TOKEN secret."
        required: false
        default: false
        type: boolean
      clawhub_skill_names:
        description: "clawhub-publish.yml skill_names. Empty selects all; [] selects none."
        required: false
        default: ""
        type: string
      clawhub_plugin_names:
        description: "clawhub-publish.yml plugin_names. Empty selects all; [] selects none."
        required: false
        default: ""
        type: string
      failure_issue_title:
        description: "Title of the single issue a failed scheduled run opens or comments on."
        required: false
        default: "Scheduled regeneration failed"
        type: string
      runs_on:
        description: "Runner to use (e.g. ubuntu-latest). Must be ephemeral: the claudebox action mounts the Docker socket."
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key for claudebox. Set this, CLAUDE_CODE_OAUTH_TOKEN, or both."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token for claudebox. Set this, ANTHROPIC_API_KEY, or both."
        required: false
      CLAWHUB_TOKEN:
        description: "ClawHub token, only used when clawhub_publish is true."
        required: false

# One run per repository at a time, never cancelled: a run that already
# pushed must finish publishing, and a queued run then starts from the new
# head instead of racing for the same version.
concurrency:
  group: regen-and-update-repo-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  regen:
    name: Regenerate
    runs-on: ${{ inputs.runs_on }}
    if: github.ref_type == 'branch'
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: .reusable-workflow-tools
          sparse-checkout: scripts
          persist-credentials: false

      # actions/checkout only writes inside the workspace; move the tools out
      # so they never show up in the repository's git status.
      - name: Move reusable workflow tools out of the workspace
        run: mv .reusable-workflow-tools "${RUNNER_TEMP}/reusable-workflow-tools"

      - name: Validate inputs
        env:
          FIX_ATTEMPTS: ${{ inputs.fix_attempts }}
        run: |
          case "${FIX_ATTEMPTS}" in
            0 | 1 | 2 | 3) ;;
            *) echo "::error::fix_attempts must be 0 to 3, got ${FIX_ATTEMPTS}"; exit 1 ;;
          esac

      - name: Generate
        env:
          GENERATE_COMMAND: ${{ inputs.generate_command }}
        run: bash -euo pipefail -c "${GENERATE_COMMAND}"

      # git status --porcelain, not git diff: it also sees NEW untracked files
      # and still ignores everything in .gitignore (same rule as
      # code-workflow.yml's drift check).
      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          changes="$(git status --porcelain)"
          if [ -z "${changes}" ]; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            echo "No changes after generation; nothing to release." >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "changed=true" >>"${GITHUB_OUTPUT}"
          echo "::group::Changed paths"
          echo "${changes}"
          echo "::endgroup::"

      # Every check run keeps its log for the fix loop and fails the run only
      # when the checks themselves changed the tree. A failed check sets
      # passed=false and the fix loop below takes over.
      - name: Checks
        id: check0
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-'
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "0"
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-check.sh"

      - name: Prepare fix attempt 1
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check0.outputs.passed == 'false' && inputs.fix_attempts >= 1
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "1"
          MAX_ATTEMPTS: ${{ inputs.fix_attempts }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          WRITING_RULES: ${{ runner.temp }}/reusable-workflow-tools/scripts/regen-writing-rules.md
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-fix.sh" prepare

      # Claude works directly on the checkout. A failed or timed-out attempt
      # is not fatal: the guard and the checks below decide.
      - name: Fix attempt 1
        id: fix1
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check0.outputs.passed == 'false' && inputs.fix_attempts >= 1
        continue-on-error: true
        timeout-minutes: ${{ inputs.fix_timeout_minutes }}
        uses: psyb0t/docker-claudebox@0e4374ad0ba42d8d7c622bb1a5c40ed6dd1a6b2d # v2.7.0
        with:
          prompt-file: ${{ runner.temp }}/regen-fix/attempt-1/prompt.md
          context-path: ${{ runner.temp }}/regen-fix/attempt-1/context
          output-path: ${{ github.workspace }}
          model: ${{ inputs.claude_model }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Guard fix attempt 1
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check0.outputs.passed == 'false' && inputs.fix_attempts >= 1
        env:
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "1"
          PROTECTED_PATHS_RE: ${{ inputs.fix_protected_paths }}
          RESULT: ${{ steps.fix1.outputs.result }}
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-fix.sh" guard

      - name: Checks after fix attempt 1
        id: check1
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check0.outputs.passed == 'false' && inputs.fix_attempts >= 1
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "1"
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-check.sh"

      - name: Prepare fix attempt 2
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check1.outputs.passed == 'false' && inputs.fix_attempts >= 2
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "2"
          MAX_ATTEMPTS: ${{ inputs.fix_attempts }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          WRITING_RULES: ${{ runner.temp }}/reusable-workflow-tools/scripts/regen-writing-rules.md
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-fix.sh" prepare

      # Claude works directly on the checkout. A failed or timed-out attempt
      # is not fatal: the guard and the checks below decide.
      - name: Fix attempt 2
        id: fix2
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check1.outputs.passed == 'false' && inputs.fix_attempts >= 2
        continue-on-error: true
        timeout-minutes: ${{ inputs.fix_timeout_minutes }}
        uses: psyb0t/docker-claudebox@0e4374ad0ba42d8d7c622bb1a5c40ed6dd1a6b2d # v2.7.0
        with:
          prompt-file: ${{ runner.temp }}/regen-fix/attempt-2/prompt.md
          context-path: ${{ runner.temp }}/regen-fix/attempt-2/context
          output-path: ${{ github.workspace }}
          model: ${{ inputs.claude_model }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Guard fix attempt 2
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check1.outputs.passed == 'false' && inputs.fix_attempts >= 2
        env:
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "2"
          PROTECTED_PATHS_RE: ${{ inputs.fix_protected_paths }}
          RESULT: ${{ steps.fix2.outputs.result }}
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-fix.sh" guard

      - name: Checks after fix attempt 2
        id: check2
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check1.outputs.passed == 'false' && inputs.fix_attempts >= 2
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "2"
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-check.sh"

      - name: Prepare fix attempt 3
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check2.outputs.passed == 'false' && inputs.fix_attempts >= 3
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "3"
          MAX_ATTEMPTS: ${{ inputs.fix_attempts }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          WRITING_RULES: ${{ runner.temp }}/reusable-workflow-tools/scripts/regen-writing-rules.md
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-fix.sh" prepare

      # Claude works directly on the checkout. A failed or timed-out attempt
      # is not fatal: the guard and the checks below decide.
      - name: Fix attempt 3
        id: fix3
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check2.outputs.passed == 'false' && inputs.fix_attempts >= 3
        continue-on-error: true
        timeout-minutes: ${{ inputs.fix_timeout_minutes }}
        uses: psyb0t/docker-claudebox@0e4374ad0ba42d8d7c622bb1a5c40ed6dd1a6b2d # v2.7.0
        with:
          prompt-file: ${{ runner.temp }}/regen-fix/attempt-3/prompt.md
          context-path: ${{ runner.temp }}/regen-fix/attempt-3/context
          output-path: ${{ github.workspace }}
          model: ${{ inputs.claude_model }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Guard fix attempt 3
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check2.outputs.passed == 'false' && inputs.fix_attempts >= 3
        env:
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "3"
          PROTECTED_PATHS_RE: ${{ inputs.fix_protected_paths }}
          RESULT: ${{ steps.fix3.outputs.result }}
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-fix.sh" guard

      - name: Checks after fix attempt 3
        id: check3
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && steps.check2.outputs.passed == 'false' && inputs.fix_attempts >= 3
        env:
          CHECK_COMMANDS: ${{ inputs.check_commands }}
          FIX_DIR: ${{ runner.temp }}/regen-fix
          ATTEMPT: "3"
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-check.sh"

      - name: Require passing checks
        if: steps.detect.outputs.changed == 'true' && inputs.check_commands != '' && inputs.check_commands != '-' && !(steps.check0.outputs.passed == 'true' || steps.check1.outputs.passed == 'true' || steps.check2.outputs.passed == 'true' || steps.check3.outputs.passed == 'true')
        run: |
          echo "::error::The checks still fail after ${{ inputs.fix_attempts }} fix attempt(s). Logs: the Checks steps above."
          exit 1

      # Built from the checked tree, so it carries the regeneration and every
      # fix that made the checks pass.
      - name: Build patch
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/regen-patch"
          git add --intent-to-add --all
          git diff --binary HEAD >"${RUNNER_TEMP}/regen-patch/regen.patch"

      - name: Set up Go (apidiff)
        if: steps.detect.outputs.changed == 'true' && inputs.go_apidiff
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: false

      - name: Install apidiff
        if: steps.detect.outputs.changed == 'true' && inputs.go_apidiff
        working-directory: ${{ runner.temp }}
        env:
          APIDIFF_VERSION: ${{ inputs.apidiff_version }}
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/apidiff-bin" go install "golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION}"

      - name: Build description context
        if: steps.detect.outputs.changed == 'true'
        env:
          CONTEXT_DIR: ${{ runner.temp }}/regen-context
          PROMPT_DIR: ${{ runner.temp }}/regen-prompt
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          CONTEXT_COMMAND: ${{ inputs.context_command }}
          GO_APIDIFF: ${{ inputs.go_apidiff }}
          GO_MODULE: ${{ inputs.go_module }}
          APIDIFF_BIN: ${{ runner.temp }}/apidiff-bin/apidiff
          FIX_DIR: ${{ runner.temp }}/regen-fix
          WRITING_RULES: ${{ runner.temp }}/reusable-workflow-tools/scripts/regen-writing-rules.md
        run: bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-context.sh"

      - name: Upload patch
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen-patch
          if-no-files-found: error
          retention-days: 7

      - name: Upload context
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regen-context
          path: ${{ runner.temp }}/regen-context
          if-no-files-found: error
          retention-days: 7

      - name: Upload prompt
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regen-prompt
          path: ${{ runner.temp }}/regen-prompt
          if-no-files-found: error
          retention-days: 7

  describe:
    name: Describe
    needs: [regen]
    if: needs.regen.outputs.changed == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.claude_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Download context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regen-context
          path: ${{ runner.temp }}/regen-context

      - name: Download prompt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regen-prompt
          path: ${{ runner.temp }}/regen-prompt

      # The action mounts the runner's Docker socket into claudebox; this job
      # holds only the context and the Claude credential.
      - name: Run claudebox
        uses: psyb0t/docker-claudebox@0e4374ad0ba42d8d7c622bb1a5c40ed6dd1a6b2d # v2.7.0
        with:
          prompt-file: ${{ runner.temp }}/regen-prompt/prompt.md
          context-path: ${{ runner.temp }}/regen-context
          output-path: ${{ runner.temp }}/regen-description
          model: ${{ inputs.claude_model }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Upload even after a failure so a partial output can be inspected;
      # release validates it and falls back when it is missing or malformed.
      - name: Upload description
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regen-description
          path: ${{ runner.temp }}/regen-description
          if-no-files-found: warn
          retention-days: 7

  # Runs when describe failed too: the deterministic fallback covers it. Only a
  # cancelled describe (or a failed regen) stops the release.
  release:
    name: Release
    needs: [regen, describe]
    if: >-
      always()
      && needs.regen.result == 'success'
      && needs.regen.outputs.changed == 'true'
      && needs.describe.result != 'cancelled'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      # Credentials persist for the push below. Nothing in this job executes
      # repository code or anything Claude wrote.
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.regen.outputs.base_sha }}
          fetch-depth: 0

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: .reusable-workflow-tools
          sparse-checkout: scripts
          persist-credentials: false

      # actions/checkout only writes inside the workspace; move the tools out
      # so they never show up in the repository's git status.
      - name: Move reusable workflow tools out of the workspace
        run: mv .reusable-workflow-tools "${RUNNER_TEMP}/reusable-workflow-tools"

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen-patch

      - name: Download context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regen-context
          path: ${{ runner.temp }}/regen-context

      # Missing when describe failed before uploading; the release script
      # then uses its fallbacks.
      - name: Download description
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regen-description
          path: ${{ runner.temp }}/regen-description

      - name: Prepare commit and tag
        id: prepare
        env:
          PATCH_FILE: ${{ runner.temp }}/regen-patch/regen.patch
          CLAUDE_OUT_DIR: ${{ runner.temp }}/regen-description
          CONTEXT_DIR: ${{ runner.temp }}/regen-context
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          VERSION_FILES: ${{ inputs.version_files }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
          MAX_CHANGELOG_BYTES: ${{ inputs.max_changelog_bytes }}
          BLOCK_ON_REVIEW: ${{ inputs.block_on_review }}
        run: |
          set -euo pipefail
          mkdir -p "${CLAUDE_OUT_DIR}"
          bash "${RUNNER_TEMP}/reusable-workflow-tools/scripts/regen-release.sh"

      # Atomic: the branch and the tag land together or not at all. A branch
      # that moved since regen fails the push (no force), and the next run
      # regenerates from the new head.
      - name: Push
        env:
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"
          echo "Pushed ${BRANCH} and ${TAG}." >>"${GITHUB_STEP_SUMMARY}"

  github-release:
    name: GitHub release
    needs: [release]
    if: inputs.github_release && needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master
    with:
      tag: ${{ needs.release.outputs.tag }}
      runs_on: ${{ inputs.runs_on }}

  clawhub:
    name: ClawHub
    needs: [release]
    if: inputs.clawhub_publish && needs.release.outputs.tag != ''
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      tag: ${{ needs.release.outputs.tag }}
      skill_names: ${{ inputs.clawhub_skill_names }}
      plugin_names: ${{ inputs.clawhub_plugin_names }}
      runs_on: ${{ inputs.runs_on }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  report-failure:
    name: Report failure
    needs: [regen, describe, release]
    if: >-
      always()
      && github.event_name == 'schedule'
      && (needs.regen.result == 'failure' || needs.release.result == 'failure')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGEN_RESULT: ${{ needs.regen.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          TITLE: ${{ inputs.failure_issue_title }}
        run: |
          set -euo pipefail

          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"

          body="The scheduled regeneration failed in this run: ${RUN_URL}

          Job results: regen=${REGEN_RESULT}, release=${RELEASE_RESULT}.

          Nothing was pushed by the failed job. I need to read the run log, fix the cause, and close this issue once a scheduled run passes again."

          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
            echo "Commented on issue #${number}." >>"${GITHUB_STEP_SUMMARY}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
            echo "Opened a failure issue." >>"${GITHUB_STEP_SUMMARY}"
          fi
