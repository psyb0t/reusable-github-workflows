name: Docker Image Workflow

on:
  workflow_call:
    inputs:
      repository_name:
        description: "Docker repository name"
        required: true
        type: string

      target_platforms:
        description: "Target platforms"
        # Not required: it has a default, and an input that is both required and
        # defaulted can never fall back to that default. Every current caller
        # passes it explicitly, so nothing changes for them -- but a new caller
        # can now omit it and get amd64 + arm64, which is what the default was
        # always there to say.
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

      build_targets:
        description: 'JSON array of build targets. Each entry: {"tag_suffix": "", "target": "stage_name" (optional), "file": "Dockerfile.foo" (optional), "platforms": "linux/amd64" (optional, overrides input.target_platforms), "stage": 0 (optional build wave, default 0)}. Empty tag_suffix = :latest. Use "target" for multi-stage builds from one Dockerfile, "file" for multi-Dockerfile repos, "platforms" for per-image arch overrides (e.g. CUDA image amd64-only while CPU image stays multi-arch). Use "stage" to ORDER builds: all stage-0 targets build+push before any stage-1 target starts, so an image whose Dockerfile does `FROM <repo>:latest` inherits the freshly-pushed base instead of the previously-published one. Targets without "stage" are stage 0 (all parallel — unchanged). Examples: [{"target":"full","tag_suffix":""},{"target":"minimal","tag_suffix":"-minimal"}] or [{"file":"Dockerfile","tag_suffix":""},{"file":"Dockerfile.full","tag_suffix":"-full","stage":1}]'
        required: false
        type: string
        default: ""

      scan_severity:
        description: "Grype severity threshold to fail on (negligible, low, medium, high, critical)"
        required: false
        type: string
        default: "medium"

      scan_enabled:
        description: "Enable Grype vulnerability scan (runs after push, failure shows in pipeline)"
        required: false
        type: boolean
        default: true

      scan_fail_build:
        description: "Fail the workflow when Grype finds a vuln at/above scan_severity. Off by default: an image built on any real base accumulates upstream CVEs continuously, most of them with no fix available, so failing on them turns the pipeline permanently red and the signal stops meaning anything. Findings are uploaded to the Security tab either way — that is where they are meant to be read. Set true for an image where a vuln genuinely must block the release. To populate the Security tab, the caller's job must grant `permissions: security-events: write`."
        required: false
        type: boolean
        default: false

      scan_vex_file:
        description: "Path in the repo to an OpenVEX document, passed to Grype as --vex. Use it to record a CVE you have ASSESSED as not affecting this image -- a stdlib CVE in a code path the application never reaches, say -- with the justification and impact statement written down next to the assertion. That is the difference between this and a blanket ignore list: an OpenVEX statement says WHY, is machine-readable, ships in the repo, and can be reviewed like any other file. Findings it suppresses stop failing the build AND stop appearing in the Security tab, so a wrong assertion hides a real vulnerability -- write them one CVE at a time."
        required: false
        type: string
        default: ""

      scan_only_fixed:
        description: "Only report vulnerabilities that have a fix available. An image on any real base carries upstream CVEs with no patch published, which nobody can act on; hiding them makes the remaining findings a to-do list rather than weather. Off by default because it also hides genuinely unfixed problems -- turn it on where the scan is expected to gate a release."
        required: false
        type: boolean
        default: false

      dockerhub_private:
        description: "Visibility the Docker Hub repository should have. Checked after every push and corrected if it differs. Pushing to a repository that does not exist creates it, taking its visibility from the account's default setting -- so without this the result depends on a preference nobody looks at, and a repo that silently came out private still produces a green run with a successful push that nobody else can pull. Default false: these are published images."
        required: false
        type: boolean
        default: false

      sync_description:
        description: "Set the Docker Hub short description from the GitHub repository description, and prepend source + project links to the long description. Docker Hub caps the short description at 100 CHARACTERS, so a longer one is cut to end in '...'; the cut counts codepoints rather than bytes, because a byte-count would slice a multi-byte character in half."
        required: false
        type: boolean
        default: true

      readme_url_header:
        description: "Prepend links back to the GitHub repository, and to the project homepage when one is set, at the top of the long description on Docker Hub. A Docker Hub page is often where someone lands first and it has no field for either link -- the same gap GitLab has, handled the same way. Only the copy pushed to Docker Hub is touched; the README in the repository is not modified."
        required: false
        type: boolean
        default: true

      cache_mode:
        description: "Buildx cache mode (max caches all layers, min caches final only). Cache export is best-effort and never blocks image publication."
        required: false
        type: string
        default: "max"

      runs_on:
        description: "Runner to use (e.g. ubuntu-latest, self-hosted)"
        required: false
        type: string
        default: "ubuntu-latest"

      attestations:
        description: "Generate SBOM and max-mode provenance attestations on push. Disable if your registry rejects OCI attestation manifests."
        required: false
        type: boolean
        default: true

      free_disk_space:
        description: "Free ~25GB on the runner before build (removes Android SDK, .NET, Haskell, CodeQL, large apt pkgs, preloaded docker images). Default true for GitHub-hosted runners. MUST be disabled on self-hosted runners — wipes shared host directories."
        required: false
        type: boolean
        default: true

    secrets:
      dockerhub_username:
        description: "Docker Hub username"
        required: true

      dockerhub_token:
        description: "Docker Hub token"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  # ══════════════════════════════════════════════
  # Single image (default, backwards compatible)
  # ══════════════════════════════════════════════

  build:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.build_targets == ''
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        if: inputs.free_disk_space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: ${{ inputs.target_platforms }}
          tags: ${{ inputs.repository_name }}:latest
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      - name: Push release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: ${{ inputs.target_platforms }}
          tags: ${{ inputs.repository_name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      # Docker Hub has a short description and a long one, and no field at all
      # for a link -- the same gap GitLab has. The long description IS the
      # README, so the links go at the top of the copy pushed there.
      - name: Compose the Docker Hub description
        id: dockerhub_meta
        if: inputs.sync_description
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          URL_HEADER: ${{ inputs.readme_url_header }}
        run: |
          set -euo pipefail

          meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), homepage: (.homepage // "")}')

          # Docker Hub caps this at 100 CHARACTERS. jq counts codepoints; bash
          # ${#var} counts bytes and would cut a multi-byte character in half.
          short=$(printf '%s' "${meta}" | jq -r '
            .description
            | if length > 100 then .[0:97] + "..." else . end
          ')
          {
            echo "short<<EOF"
            echo "${short}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          readme="README.md"
          if [ ! -f "${readme}" ]; then
            echo "::warning::no README.md; Docker Hub long description left as is"
            echo "path=" >> "${GITHUB_OUTPUT}"

            exit 0
          fi

          target="${RUNNER_TEMP}/dockerhub-readme.md"

          if [ "${URL_HEADER}" != "true" ]; then
            cp "${readme}" "${target}"
          else
            homepage=$(printf '%s' "${meta}" | jq -r '.homepage')
            {
              printf '[Source](https://github.com/%s)' "${SOURCE}"
              if [ -n "${homepage}" ]; then
                printf ' | [Project page](%s)' "${homepage}"
              fi
              printf '\n\n'
              cat "${readme}"
            } > "${target}"
          fi

          echo "path=${target}" >> "${GITHUB_OUTPUT}"

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}
          repository: ${{ inputs.repository_name }}
          short-description: ${{ steps.dockerhub_meta.outputs.short }}
          readme-filepath: ${{ steps.dockerhub_meta.outputs.path }}

      # Pushing to a repository that does not exist creates it, and its
      # visibility comes from the account's default preference. That makes the
      # result depend on a setting nobody looks at, and a repository that came
      # out private still yields a green run with a successful push that nobody
      # else can pull. So assert it rather than hope.
      - name: Enforce Docker Hub visibility
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          REPOSITORY: ${{ inputs.repository_name }}
          WANT_PRIVATE: ${{ inputs.dockerhub_private }}
        run: |
          set -euo pipefail

          # Credentials go in on stdin, never as arguments: an argv is readable
          # by anything else on the runner.
          jwt=$(jq -nc --arg u "${DOCKERHUB_USERNAME}" --arg p "${DOCKERHUB_TOKEN}" \
            '{username: $u, password: $p}' \
            | curl -sS --fail-with-body -X POST \
              -H "Content-Type: application/json" --data @- \
              "https://hub.docker.com/v2/users/login/" \
            | jq -r '.token // empty')

          if [ -z "${jwt}" ]; then
            echo "::warning::could not authenticate to Docker Hub; visibility not verified"

            exit 0
          fi

          api="https://hub.docker.com/v2/repositories/${REPOSITORY}/"

          current=$(curl -sS -H "Authorization: JWT ${jwt}" "${api}" | jq -r '.is_private // empty')

          if [ -z "${current}" ]; then
            echo "::warning::could not read ${REPOSITORY} from Docker Hub; visibility not verified"

            exit 0
          fi

          if [ "${current}" = "${WANT_PRIVATE}" ]; then
            echo "visibility already correct (is_private=${current})"

            exit 0
          fi

          echo "correcting ${REPOSITORY}: is_private ${current} -> ${WANT_PRIVATE}"

          if ! out=$(jq -nc --argjson p "${WANT_PRIVATE}" '{is_private: $p}' \
            | curl -sS --fail-with-body -o /dev/null -X PATCH \
              -H "Authorization: JWT ${jwt}" -H "Content-Type: application/json" \
              --data @- "${api}" 2>&1); then
            echo "::error::could not set visibility on ${REPOSITORY}: ${out}" >&2
            exit 1
          fi

          echo "visibility set to is_private=${WANT_PRIVATE}"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2

  scan:
    needs: build
    if: always() && needs.build.result == 'success' && inputs.build_targets == '' && inputs.scan_enabled
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read # check the VEX document out, when the caller passes one
      security-events: write # upload the Grype SARIF to the repo Security tab
    steps:
      # Only when a VEX document is in play. The scan otherwise needs nothing
      # from the repo -- it pulls the pushed image -- so checking out
      # unconditionally would cost every caller a clone for no reason.
      - name: Check out the VEX document
        if: inputs.scan_vex_file != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Scan pushed image with Grype
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.repository_name }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          fail-build: ${{ inputs.scan_fail_build }}
          severity-cutoff: ${{ inputs.scan_severity }}
          vex: ${{ inputs.scan_vex_file }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          output-format: sarif

      # Publish findings to Security > Code scanning, even when the scan step
      # failed the build (fail-build: true) — so results are visible either way.
      # continue-on-error: the upload 403s if the caller didn't grant
      # security-events: write; that must not fail an otherwise-green run.
      - name: Upload Grype SARIF to the Security tab
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

  # ══════════════════════════════════════════════
  # Multi-target build (staged: base first, dependents after)
  # ══════════════════════════════════════════════

  # Partition build_targets into ordered waves by optional per-target "stage"
  # (default 0). Wave 0 builds+pushes first; wave 1 builds after. Targets with
  # no "stage" all land in wave 0 → fully parallel, identical to the previous
  # behavior. Set "stage": 1 on an image that does `FROM <repo>:latest` so it
  # inherits the freshly-pushed base instead of the previously-published one.
  plan-multi:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.build_targets != ''
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    outputs:
      wave0: ${{ steps.split.outputs.wave0 }}
      wave1: ${{ steps.split.outputs.wave1 }}
    steps:
      - name: Split build targets into stage waves
        id: split
        env:
          TARGETS: ${{ inputs.build_targets }}
        run: |
          echo "wave0=$(jq -c '[.[] | select((.stage // 0) == 0)]' <<<"$TARGETS")" >> "$GITHUB_OUTPUT"
          echo "wave1=$(jq -c '[.[] | select((.stage // 0) == 1)]' <<<"$TARGETS")" >> "$GITHUB_OUTPUT"

  build-multi:
    needs: plan-multi
    if: needs.plan-multi.result == 'success' && needs.plan-multi.outputs.wave0 != '[]'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan-multi.outputs.wave0) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        if: inputs.free_disk_space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:latest${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      - name: Push release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:${{ github.ref_name }}${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

  # Wave 1 — runs only after every wave-0 target has pushed. Identical build
  # steps; the sole differences are the matrix source (wave1) and the `needs`
  # gate on build-multi. Skipped entirely when no target sets "stage": 1.
  build-multi-wave1:
    needs: [plan-multi, build-multi]
    # Same trap: this tolerates `build-multi` being skipped (a repo whose
    # targets are all wave-1), but without `always()` GitHub skips wave 1 too
    # and nothing gets built at all.
    # plan-multi.result == 'success' is load-bearing, not belt-and-braces. When
    # the caller sets no build_targets, plan-multi is SKIPPED and every output
    # of a skipped job is the empty string -- so `outputs.wave1 != '[]'` is TRUE
    # ('' is not '[]'), this job is scheduled, and its matrix then evaluates
    # fromJson('') and cannot be built. That fails the whole run with no failed
    # job, no step logs and no retry available, which is exactly as confusing as
    # it sounds. build-multi already gates on the result for the same reason.
    if: always() && needs.plan-multi.result == 'success' && needs.plan-multi.outputs.wave1 != '[]' && (needs.build-multi.result == 'success' || needs.build-multi.result == 'skipped')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan-multi.outputs.wave1) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        if: inputs.free_disk_space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:latest${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      - name: Push release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:${{ github.ref_name }}${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

  release-multi:
    needs: [build-multi, build-multi-wave1]
    # `always()` is load-bearing, not decoration. Without it GitHub skips this
    # job the moment `build-multi-wave1` is skipped — BEFORE the `if` is
    # evaluated — so the `|| ... == 'skipped'` tolerance below never gets a
    # chance to run. A repo with no wave-1 targets therefore built and pushed
    # its images but never cut a GitHub Release. `scan-multi` has carried this
    # guard all along; these jobs were missing it.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2

  scan-multi:
    needs: [build-multi, build-multi-wave1]
    if: always() && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped') && inputs.build_targets != '' && inputs.scan_enabled
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read # check the VEX document out, when the caller passes one
      security-events: write # upload the Grype SARIF to the repo Security tab
    strategy:
      matrix:
        include: ${{ fromJson(inputs.build_targets) }}
    steps:
      # See the single-image scan job: checkout only when a VEX path needs it.
      - name: Check out the VEX document
        if: inputs.scan_vex_file != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Scan pushed image with Grype
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.repository_name }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}${{ matrix.tag_suffix }}
          fail-build: ${{ inputs.scan_fail_build }}
          severity-cutoff: ${{ inputs.scan_severity }}
          vex: ${{ inputs.scan_vex_file }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          output-format: sarif

      # Per-image category so each matrix target's SARIF is tracked separately
      # in the Security tab instead of overwriting the others.
      - name: Upload Grype SARIF to the Security tab
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype${{ matrix.tag_suffix }}

  update-dockerhub-description:
    needs: [build-multi, build-multi-wave1]
    # Same skipped-dependency trap as release-multi above — see the note there.
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.build_targets != '' && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Docker Hub has a short description and a long one, and no field at all
      # for a link -- the same gap GitLab has. The long description IS the
      # README, so the links go at the top of the copy pushed there.
      - name: Compose the Docker Hub description
        id: dockerhub_meta
        if: inputs.sync_description
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          URL_HEADER: ${{ inputs.readme_url_header }}
        run: |
          set -euo pipefail

          meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), homepage: (.homepage // "")}')

          # Docker Hub caps this at 100 CHARACTERS. jq counts codepoints; bash
          # ${#var} counts bytes and would cut a multi-byte character in half.
          short=$(printf '%s' "${meta}" | jq -r '
            .description
            | if length > 100 then .[0:97] + "..." else . end
          ')
          {
            echo "short<<EOF"
            echo "${short}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          readme="README.md"
          if [ ! -f "${readme}" ]; then
            echo "::warning::no README.md; Docker Hub long description left as is"
            echo "path=" >> "${GITHUB_OUTPUT}"

            exit 0
          fi

          target="${RUNNER_TEMP}/dockerhub-readme.md"

          if [ "${URL_HEADER}" != "true" ]; then
            cp "${readme}" "${target}"
          else
            homepage=$(printf '%s' "${meta}" | jq -r '.homepage')
            {
              printf '[Source](https://github.com/%s)' "${SOURCE}"
              if [ -n "${homepage}" ]; then
                printf ' | [Project page](%s)' "${homepage}"
              fi
              printf '\n\n'
              cat "${readme}"
            } > "${target}"
          fi

          echo "path=${target}" >> "${GITHUB_OUTPUT}"

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}
          repository: ${{ inputs.repository_name }}
          short-description: ${{ steps.dockerhub_meta.outputs.short }}
          readme-filepath: ${{ steps.dockerhub_meta.outputs.path }}

      # Pushing to a repository that does not exist creates it, and its
      # visibility comes from the account's default preference. That makes the
      # result depend on a setting nobody looks at, and a repository that came
      # out private still yields a green run with a successful push that nobody
      # else can pull. So assert it rather than hope.
      - name: Enforce Docker Hub visibility
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          REPOSITORY: ${{ inputs.repository_name }}
          WANT_PRIVATE: ${{ inputs.dockerhub_private }}
        run: |
          set -euo pipefail

          # Credentials go in on stdin, never as arguments: an argv is readable
          # by anything else on the runner.
          jwt=$(jq -nc --arg u "${DOCKERHUB_USERNAME}" --arg p "${DOCKERHUB_TOKEN}" \
            '{username: $u, password: $p}' \
            | curl -sS --fail-with-body -X POST \
              -H "Content-Type: application/json" --data @- \
              "https://hub.docker.com/v2/users/login/" \
            | jq -r '.token // empty')

          if [ -z "${jwt}" ]; then
            echo "::warning::could not authenticate to Docker Hub; visibility not verified"

            exit 0
          fi

          api="https://hub.docker.com/v2/repositories/${REPOSITORY}/"

          current=$(curl -sS -H "Authorization: JWT ${jwt}" "${api}" | jq -r '.is_private // empty')

          if [ -z "${current}" ]; then
            echo "::warning::could not read ${REPOSITORY} from Docker Hub; visibility not verified"

            exit 0
          fi

          if [ "${current}" = "${WANT_PRIVATE}" ]; then
            echo "visibility already correct (is_private=${current})"

            exit 0
          fi

          echo "correcting ${REPOSITORY}: is_private ${current} -> ${WANT_PRIVATE}"

          if ! out=$(jq -nc --argjson p "${WANT_PRIVATE}" '{is_private: $p}' \
            | curl -sS --fail-with-body -o /dev/null -X PATCH \
              -H "Authorization: JWT ${jwt}" -H "Content-Type: application/json" \
              --data @- "${api}" 2>&1); then
            echo "::error::could not set visibility on ${REPOSITORY}: ${out}" >&2
            exit 1
          fi

          echo "visibility set to is_private=${WANT_PRIVATE}"
