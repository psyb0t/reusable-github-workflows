name: Docker Image Workflow

on:
  workflow_call:
    inputs:
      repository_name:
        description: "Docker repository name"
        required: true
        type: string

      target_platforms:
        description: "Target platforms"
        # Not required: it has a default, and an input that is both required and
        # defaulted can never fall back to that default. Every current caller
        # passes it explicitly, so nothing changes for them -- but a new caller
        # can now omit it and get amd64 + arm64, which is what the default was
        # always there to say.
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

      build_targets:
        description: 'JSON array of build targets. Each entry: {"tag_prefix": "" (optional), "tag_suffix": "" (optional), "build_args": "NAME=value" (optional), "target": "stage_name" (optional), "file": "Dockerfile.foo" (optional), "platforms": "linux/amd64" (optional, overrides input.target_platforms), "stage": 0 (optional build wave, default 0)}. A tag is :<tag_prefix><latest-or-release><tag_suffix>; omitted prefix and suffix produce :latest / :vX.Y.Z. Use "target" for multi-stage builds from one Dockerfile, "file" for multi-Dockerfile repos, "platforms" for per-image arch overrides (e.g. CUDA image amd64-only while CPU image stays multi-arch), and "build_args" only for non-secret Docker build arguments. Use "stage" to ORDER builds: all stage-0 targets build+push before any stage-1 target starts, so an image whose Dockerfile does `FROM <repo>:latest` inherits the freshly-pushed base instead of the previously-published one. Targets without "stage" are stage 0 (all parallel — unchanged). Examples: [{"target":"full","tag_suffix":""},{"target":"minimal","tag_suffix":"-minimal"}] or [{"file":"Dockerfile","tag_suffix":""},{"file":"Dockerfile.full","tag_suffix":"-full","stage":1}]'
        required: false
        type: string
        default: ""

      scan_severity:
        description: "Grype severity threshold to fail on (negligible, low, medium, high, critical)"
        required: false
        type: string
        default: "medium"

      scan_enabled:
        description: "Enable Grype vulnerability scan (runs after push, failure shows in pipeline)"
        required: false
        type: boolean
        default: true

      scan_fail_build:
        description: "Ask Grype to mark findings at or above scan_severity as failures. Off by default: an image built on any real base accumulates upstream CVEs continuously, most of them with no fix available, so failing on them turns the pipeline permanently red and the signal stops meaning anything. Findings are uploaded to the Security tab either way. Scans never gate image publishing or a GitHub Release; set true only when the scan step itself should be marked failed for visibility. To populate the Security tab, the caller's job must grant `permissions: security-events: write`."
        required: false
        type: boolean
        default: false

      scan_vex_file:
        description: "Path in the repo to an OpenVEX document, passed to Grype as --vex. Use it to record a CVE you have ASSESSED as not affecting this image -- a stdlib CVE in a code path the application never reaches, say -- with the justification and impact statement written down next to the assertion. That is the difference between this and a blanket ignore list: an OpenVEX statement says WHY, is machine-readable, ships in the repo, and can be reviewed like any other file. Findings it suppresses stop failing the build AND stop appearing in the Security tab, so a wrong assertion hides a real vulnerability -- write them one CVE at a time."
        required: false
        type: string
        default: ""

      scan_only_fixed:
        description: "Only report vulnerabilities that have a fix available. An image on any real base carries upstream CVEs with no patch published, which nobody can act on; hiding them makes the remaining findings a to-do list rather than weather. Off by default because it also hides genuinely unfixed problems -- turn it on where the scan is expected to gate a release."
        required: false
        type: boolean
        default: false

      dockerhub_private:
        description: "Visibility the Docker Hub repository should have. Checked after every push and corrected if it differs. Pushing to a repository that does not exist creates it, taking its visibility from the account's default setting -- so without this the result depends on a preference nobody looks at, and a repo that silently came out private still produces a green run with a successful push that nobody else can pull. Default false: these are published images."
        required: false
        type: boolean
        default: false

      sync_description:
        description: "Set the Docker Hub short description from the GitHub repository description, and prepend source + project links to the long description. Docker Hub caps the short description at 100 UTF-8 bytes, so a longer one is cut on a whole-character boundary to end in '...'."
        required: false
        type: boolean
        default: true

      readme_url_header:
        description: "Prepend links back to the GitHub repository, and to the project homepage when one is set, at the top of the long description on Docker Hub. A Docker Hub page is often where someone lands first and it has no field for either link -- the same gap GitLab has, handled the same way. Only the copy pushed to Docker Hub is touched; the README in the repository is not modified."
        required: false
        type: boolean
        default: true

      cache_mode:
        description: "Buildx cache mode (max caches all layers, min caches final only). Cache export is best-effort and never blocks image publication."
        required: false
        type: string
        default: "max"

      runs_on:
        description: "Runner to use (e.g. ubuntu-latest, self-hosted)"
        required: false
        type: string
        default: "ubuntu-latest"

      attestations:
        description: "Generate SBOM and max-mode provenance attestations on push. Disable if your registry rejects OCI attestation manifests."
        required: false
        type: boolean
        default: true

      sbom_artifact:
        description: "Generate a downloadable SPDX SBOM for each pushed image and upload it to the run's Actions artifacts. Independent of `attestations`, which attaches the SBOM to the image in the registry instead of the run."
        required: false
        type: boolean
        default: true

      free_disk_space:
        description: "Free disk space before build by removing Android SDK, .NET, Haskell, selected apt packages, and preloaded Docker images. Default true for GitHub-hosted Linux runners. The cleanup tool refuses self-hosted or non-Linux runners before invoking sudo."
        required: false
        type: boolean
        default: true

    secrets:
      dockerhub_username:
        description: "Docker Hub username"
        required: true

      dockerhub_token:
        description: "Docker Hub access token, NOT the account password. It must carry Read, Write AND Delete. That is more than it sounds: pushing an image only needs Write, but writing repository METADATA -- the description, the README, the visibility flag -- sits behind the same scope Docker Hub uses for Delete, and there is no tier in between. A Read/Write token pushes images perfectly well and then fails every metadata call with `access denied: insufficient scope`, which is easy to mistake for a broken workflow. Nothing here ever issues a DELETE."
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.repository_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

# Pinned Syft and Grype releases, with the sha256 of each Linux tarball from
# their published checksum files. The jobs verify a download before running it,
# so a re-tagged or tampered release cannot execute on the runner. Bump each
# tool's version and both architecture checksums together.
env:
  SYFT_VERSION: "1.51.0"
  SYFT_SHA256_LINUX_AMD64: "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f"
  SYFT_SHA256_LINUX_ARM64: "6c0466811541ea03add5213a60a1562f0851e4c0b0ecfdee1a694a9455285900"
  GRYPE_VERSION: "0.118.0"
  GRYPE_SHA256_LINUX_AMD64: "1d444c5e7360471815f7158f71935fcecc68a3c417d85c7344f770854300bba2"
  GRYPE_SHA256_LINUX_ARM64: "32aceeb8ee837244775fcb522372c8b3a47914986385f3148f4ee2c930482a84"

jobs:
  # ══════════════════════════════════════════════
  # Single image (default, backwards compatible)
  # ══════════════════════════════════════════════

  build:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.build_targets == ''
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Free disk space
        if: inputs.free_disk_space
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash reusable-workflow-tools/scripts/free-disk-space.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: ${{ inputs.target_platforms }}
          tags: ${{ inputs.repository_name }}:latest
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      - name: Push release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: ${{ inputs.target_platforms }}
          tags: ${{ inputs.repository_name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      # Docker Hub has a short description and a long one, and no field at all
      # for a link -- the same gap GitLab has. The long description IS the
      # README, so the links go at the top of the copy pushed there.
      - name: Compose the Docker Hub description
        id: dockerhub_meta
        if: inputs.sync_description
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          URL_HEADER: ${{ inputs.readme_url_header }}
        run: |
          set -euo pipefail

          meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), homepage: (.homepage // "")}')

          short=$(printf '%s' "${meta}" | jq -jr '.description' |
            bash reusable-workflow-tools/scripts/dockerhub-short-description.sh)
          {
            echo "short<<EOF"
            echo "${short}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          readme="README.md"
          if [ ! -f "${readme}" ]; then
            echo "::warning::no README.md; Docker Hub long description left as is"
            echo "path=" >> "${GITHUB_OUTPUT}"

            exit 0
          fi

          target="${RUNNER_TEMP}/dockerhub-readme.md"

          if [ "${URL_HEADER}" != "true" ]; then
            cp "${readme}" "${target}"
          else
            homepage=$(printf '%s' "${meta}" | jq -r '.homepage')
            {
              printf '[Source](https://github.com/%s)' "${SOURCE}"
              if [ -n "${homepage}" ]; then
                printf ' | [Project page](%s)' "${homepage}"
              fi
              printf '\n\n'
              cat "${readme}"
            } > "${target}"
          fi

          echo "path=${target}" >> "${GITHUB_OUTPUT}"

      - name: Sync Docker Hub metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          REPOSITORY: ${{ inputs.repository_name }}
          WANT_PRIVATE: ${{ inputs.dockerhub_private }}
          SYNC_DESCRIPTION: ${{ inputs.sync_description }}
          SHORT_DESCRIPTION: ${{ steps.dockerhub_meta.outputs.short }}
          DESCRIPTION_FILE: ${{ steps.dockerhub_meta.outputs.path }}
        run: bash reusable-workflow-tools/scripts/dockerhub-metadata.sh

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash reusable-workflow-tools/scripts/github-release.sh

  scan:
    needs: build
    if: always() && needs.build.result == 'success' && inputs.build_targets == '' && inputs.scan_enabled
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read # check the VEX document out, when the caller passes one
      security-events: write # upload the Grype SARIF to the repo Security tab
    steps:
      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Check out the VEX document
        if: inputs.scan_vex_file != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: caller

      - name: Scan pushed image with Grype
        id: scan
        # The image and release have already published. Preserve the scan step's
        # own failure signal, but do not let an unavailable scanner turn a
        # successful release into a failed caller workflow.
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          IMAGE: ${{ inputs.repository_name }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          OUTPUT_FILE: grype.sarif
          SCAN_FAIL_BUILD: ${{ inputs.scan_fail_build }}
          SCAN_SEVERITY: ${{ inputs.scan_severity }}
          ONLY_FIXED: ${{ inputs.scan_only_fixed }}
          VEX_FILE: ${{ inputs.scan_vex_file != '' && format('caller/{0}', inputs.scan_vex_file) || '' }}
        run: bash reusable-workflow-tools/scripts/grype-scan.sh

      # Publish findings to Security > Code scanning even when Grype marks its
      # own step failed, so results remain visible without blocking the release.
      # continue-on-error: the upload 403s if the caller didn't grant
      # security-events: write; that must not fail an otherwise-green run.
      - name: Upload Grype SARIF to the Security tab
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

  # A downloadable copy of the SBOM to sit beside the registry attestation, so
  # the bill of materials is reachable from the run page without any registry or
  # attestation tooling. syft is fetched as a pinned release binary and its
  # tarball verified against a committed sha256 before it runs, so a re-tagged or
  # tampered release cannot execute here. No third-party action is added; the
  # GitHub-owned upload-artifact publishes the file. This is a leaf job, nothing
  # gates on it, and every step is best-effort so an SBOM hiccup never reddens an
  # otherwise-green published run.
  sbom:
    needs: build
    if: always() && needs.build.result == 'success' && inputs.build_targets == '' && inputs.sbom_artifact
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Generate SPDX SBOM with syft
        id: sbom
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.repository_name }}:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        run: |
          set -euo pipefail

          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          case "$arch" in
            amd64) want_sha="$SYFT_SHA256_LINUX_AMD64" ;;
            arm64) want_sha="$SYFT_SHA256_LINUX_ARM64" ;;
            *) echo "::error::unsupported runner arch ${arch}"; exit 1 ;;
          esac

          tarball="syft_${SYFT_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$tarball" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
          echo "${want_sha}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" syft
          test -x ./syft || { echo "::error::syft binary not extracted"; exit 1; }

          out="sbom-${IMAGE##*:}.spdx.json"
          ./syft scan "registry:${IMAGE}" -o "spdx-json=${out}"
          echo "file=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        if: steps.sbom.outputs.file != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.sbom.outputs.file }}
          path: ${{ steps.sbom.outputs.file }}
          if-no-files-found: error

  # ══════════════════════════════════════════════
  # Multi-target build (staged: base first, dependents after)
  # ══════════════════════════════════════════════

  # TODO: Deduplicate branch and tag runs for one release, and resolve
  # dependent targets against that release's base image instead of `latest`.

  # Partition build_targets into ordered waves by optional per-target "stage"
  # (default 0). Wave 0 builds+pushes first; wave 1 builds after. Targets with
  # no "stage" all land in wave 0 → fully parallel, identical to the previous
  # behavior. Set "stage": 1 on an image that does `FROM <repo>:latest` so it
  # inherits the freshly-pushed base instead of the previously-published one.
  plan-multi:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.build_targets != ''
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    outputs:
      wave0: ${{ steps.split.outputs.wave0 }}
      wave1: ${{ steps.split.outputs.wave1 }}
    steps:
      - name: Split build targets into stage waves
        id: split
        env:
          TARGETS: ${{ inputs.build_targets }}
        run: |
          echo "wave0=$(jq -c '[.[] | select((.stage // 0) == 0)]' <<<"$TARGETS")" >> "$GITHUB_OUTPUT"
          echo "wave1=$(jq -c '[.[] | select((.stage // 0) == 1)]' <<<"$TARGETS")" >> "$GITHUB_OUTPUT"

  build-multi:
    needs: plan-multi
    if: needs.plan-multi.result == 'success' && needs.plan-multi.outputs.wave0 != '[]'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan-multi.outputs.wave0) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Free disk space
        if: inputs.free_disk_space
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash reusable-workflow-tools/scripts/free-disk-space.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:${{ matrix.tag_prefix || '' }}latest${{ matrix.tag_suffix || '' }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      - name: Push release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:${{ matrix.tag_prefix || '' }}${{ github.ref_name }}${{ matrix.tag_suffix || '' }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

  # Wave 1 — runs only after every wave-0 target has pushed. Identical build
  # steps; the sole differences are the matrix source (wave1) and the `needs`
  # gate on build-multi. Skipped entirely when no target sets "stage": 1.
  build-multi-wave1:
    needs: [plan-multi, build-multi]
    # Same trap: this tolerates `build-multi` being skipped (a repo whose
    # targets are all wave-1), but without `always()` GitHub skips wave 1 too
    # and nothing gets built at all.
    # plan-multi.result == 'success' is load-bearing, not belt-and-braces. When
    # the caller sets no build_targets, plan-multi is SKIPPED and every output
    # of a skipped job is the empty string -- so `outputs.wave1 != '[]'` is TRUE
    # ('' is not '[]'), this job is scheduled, and its matrix then evaluates
    # fromJson('') and cannot be built. That fails the whole run with no failed
    # job, no step logs and no retry available, which is exactly as confusing as
    # it sounds. build-multi already gates on the result for the same reason.
    if: always() && needs.plan-multi.result == 'success' && needs.plan-multi.outputs.wave1 != '[]' && (needs.build-multi.result == 'success' || needs.build-multi.result == 'skipped')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan-multi.outputs.wave1) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Free disk space
        if: inputs.free_disk_space
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
        run: bash reusable-workflow-tools/scripts/free-disk-space.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Push latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:${{ matrix.tag_prefix || '' }}latest${{ matrix.tag_suffix || '' }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

      - name: Push release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          file: ${{ matrix.file || 'Dockerfile' }}
          platforms: ${{ matrix.platforms || inputs.target_platforms }}
          target: ${{ matrix.target || '' }}
          tags: ${{ inputs.repository_name }}:${{ matrix.tag_prefix || '' }}${{ github.ref_name }}${{ matrix.tag_suffix || '' }}
          build-args: ${{ matrix.build_args || '' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          cache-to: type=gha,mode=${{ inputs.cache_mode }},ignore-error=true,scope=${{ github.ref_name }}-${{ matrix.target || matrix.tag_prefix || matrix.tag_suffix }}
          provenance: ${{ inputs.attestations && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attestations }}

  release-multi:
    needs: [build-multi, build-multi-wave1]
    # `always()` is load-bearing, not decoration. Without it GitHub skips this
    # job the moment `build-multi-wave1` is skipped — BEFORE the `if` is
    # evaluated — so the `|| ... == 'skipped'` tolerance below never gets a
    # chance to run. A repo with no wave-1 targets therefore built and pushed
    # its images but never cut a GitHub Release. `scan-multi` has carried this
    # guard all along; these jobs were missing it.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash reusable-workflow-tools/scripts/github-release.sh

  scan-multi:
    needs: [build-multi, build-multi-wave1]
    if: always() && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped') && inputs.build_targets != '' && inputs.scan_enabled
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read # check the VEX document out, when the caller passes one
      security-events: write # upload the Grype SARIF to the repo Security tab
    strategy:
      # A broken scan must not cancel another target's Security report.
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_targets) }}
    steps:
      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      - name: Check out the VEX document
        if: inputs.scan_vex_file != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: caller

      - name: Scan pushed image with Grype
        id: scan
        # Images and the GitHub Release are already published. Preserve scan
        # failure visibility without making it a release gate.
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          IMAGE: ${{ inputs.repository_name }}:${{ matrix.tag_prefix || '' }}${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}${{ matrix.tag_suffix || '' }}
          # Every matrix entry runs in its own runner workspace, so a fixed
          # filename is collision-free. Keeping caller-controlled tag text out
          # of a filesystem path also prevents an invalid or traversal-shaped
          # tag prefix or suffix from breaking the report upload.
          OUTPUT_FILE: grype.sarif
          SCAN_FAIL_BUILD: ${{ inputs.scan_fail_build }}
          SCAN_SEVERITY: ${{ inputs.scan_severity }}
          ONLY_FIXED: ${{ inputs.scan_only_fixed }}
          VEX_FILE: ${{ inputs.scan_vex_file != '' && format('caller/{0}', inputs.scan_vex_file) || '' }}
        run: bash reusable-workflow-tools/scripts/grype-scan.sh

      # Per-image category so each matrix target's SARIF is tracked separately
      # in the Security tab instead of overwriting the others.
      - name: Upload Grype SARIF to the Security tab
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype${{ matrix.tag_prefix || matrix.tag_suffix || '' }}

  # Per-target SBOM for the multi-target build. Same syft install and best-effort
  # posture as the single-image `sbom` job; the tag carries the matrix target's
  # prefix/suffix so each image uploads its own artifact.
  sbom-multi:
    needs: [build-multi, build-multi-wave1]
    if: always() && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped') && inputs.build_targets != '' && inputs.sbom_artifact
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(inputs.build_targets) }}
    steps:
      - name: Generate SPDX SBOM with syft
        id: sbom
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.repository_name }}:${{ matrix.tag_prefix || '' }}${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}${{ matrix.tag_suffix || '' }}
        run: |
          set -euo pipefail

          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          case "$arch" in
            amd64) want_sha="$SYFT_SHA256_LINUX_AMD64" ;;
            arm64) want_sha="$SYFT_SHA256_LINUX_ARM64" ;;
            *) echo "::error::unsupported runner arch ${arch}"; exit 1 ;;
          esac

          tarball="syft_${SYFT_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$tarball" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${tarball}"
          echo "${want_sha}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" syft
          test -x ./syft || { echo "::error::syft binary not extracted"; exit 1; }

          out="sbom-${IMAGE##*:}.spdx.json"
          ./syft scan "registry:${IMAGE}" -o "spdx-json=${out}"
          echo "file=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        if: steps.sbom.outputs.file != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.sbom.outputs.file }}
          path: ${{ steps.sbom.outputs.file }}
          if-no-files-found: error

  update-dockerhub-description:
    needs: [build-multi, build-multi-wave1]
    # Same skipped-dependency trap as release-multi above — see the note there.
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.build_targets != '' && needs.build-multi.result == 'success' && (needs.build-multi-wave1.result == 'success' || needs.build-multi-wave1.result == 'skipped')
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout reusable workflow tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: psyb0t/reusable-github-workflows
          ref: master
          path: reusable-workflow-tools
          sparse-checkout: scripts

      # Docker Hub has a short description and a long one, and no field at all
      # for a link -- the same gap GitLab has. The long description IS the
      # README, so the links go at the top of the copy pushed there.
      - name: Compose the Docker Hub description
        id: dockerhub_meta
        if: inputs.sync_description
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          URL_HEADER: ${{ inputs.readme_url_header }}
        run: |
          set -euo pipefail

          meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), homepage: (.homepage // "")}')

          short=$(printf '%s' "${meta}" | jq -jr '.description' |
            bash reusable-workflow-tools/scripts/dockerhub-short-description.sh)
          {
            echo "short<<EOF"
            echo "${short}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          readme="README.md"
          if [ ! -f "${readme}" ]; then
            echo "::warning::no README.md; Docker Hub long description left as is"
            echo "path=" >> "${GITHUB_OUTPUT}"

            exit 0
          fi

          target="${RUNNER_TEMP}/dockerhub-readme.md"

          if [ "${URL_HEADER}" != "true" ]; then
            cp "${readme}" "${target}"
          else
            homepage=$(printf '%s' "${meta}" | jq -r '.homepage')
            {
              printf '[Source](https://github.com/%s)' "${SOURCE}"
              if [ -n "${homepage}" ]; then
                printf ' | [Project page](%s)' "${homepage}"
              fi
              printf '\n\n'
              cat "${readme}"
            } > "${target}"
          fi

          echo "path=${target}" >> "${GITHUB_OUTPUT}"

      - name: Sync Docker Hub metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          REPOSITORY: ${{ inputs.repository_name }}
          WANT_PRIVATE: ${{ inputs.dockerhub_private }}
          SYNC_DESCRIPTION: ${{ inputs.sync_description }}
          SHORT_DESCRIPTION: ${{ steps.dockerhub_meta.outputs.short }}
          DESCRIPTION_FILE: ${{ steps.dockerhub_meta.outputs.path }}
        run: bash reusable-workflow-tools/scripts/dockerhub-metadata.sh
