name: archive-self

# Deliberately NOT named archive.yml: that filename is taken by the reusable
# workflow definition this repo publishes. This is the caller that archives this
# repo itself, and the two cannot share a name.
#
# Without it the repo looked archived to any check that only asked "is there an
# archive.yml here" -- there is, but it is a workflow_call definition that never
# fires on its own, so nothing was ever archived. The same collision hid the
# mirror gap; see mirror.yml.
on:
  release:
    types: [published]
  schedule:
    # Staggered like every other caller so the repos do not all hit a
    # rate-limited service in the same minute.
    - cron: "23 3 9 * *"
  workflow_dispatch:

jobs:
  archive:
    uses: psyb0t/reusable-github-workflows/.github/workflows/archive.yml@master
    with:
      # Off because no archive.org keys are set on this repo. Outlink capture
      # only works on the authenticated Save Page Now API; on the keyless path
      # the flag is silently ignored, so leaving it on would just log a warning
      # every run. Add wayback_access_key / wayback_secret_key and flip this to
      # true to sweep in every page the README links to.
      capture_outlinks: false
