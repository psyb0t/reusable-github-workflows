name: Git Mirror

# Push-mirrors this repository to Codeberg, GitLab and/or Gitee, and syncs the
# GitHub description + topics to each one that supports them.
#
# What syncs where is NOT uniform, because the platforms genuinely differ:
#
#   platform   description   topics   project URL
#   Codeberg   yes           yes      yes (`website`)
#   GitLab     yes           yes      NO -- no such field on a project
#   Gitee      yes           NO       yes (`homepage`)
#
# GitLab's project object exposes only derived URLs (`web_url`, `readme_url`,
# ...), none of them writable, so the GitHub homepage has nowhere to go there.
#
# The synced description is prefixed (`description_prefix`, default `[mirror] `)
# so a visitor landing on a copy can tell it is one, and capped at
# `description_max_length` characters, cut to end in `...` when it would exceed
# that. The cap is in CHARACTERS, not bytes: GitLab and Gitee both reject past
# 2000 and Gitee states its limit that way ("最长为 2000 个字符"), so the
# truncation runs through jq, which counts codepoints. Bash `${#var}` counts
# bytes and would cut a description containing any multi-byte character short.
#
# Every target is OPT-IN and independent: enable only the ones you want, and a
# failure on one does not stop the others (separate jobs, no `needs`).
#
# Caller:
#
#   jobs:
#     mirror:
#       if: github.event_name == 'push'
#       uses: psyb0t/reusable-github-workflows/.github/workflows/git-mirror.yml@master
#       with:
#         codeberg_enabled: true
#         gitlab_enabled: true
#         gitee_enabled: true
#       secrets:
#         codeberg_token: ${{ secrets.CODEBERG_TOKEN }}
#         gitlab_token: ${{ secrets.GITLAB_TOKEN }}
#         gitee_token: ${{ secrets.GITEE_TOKEN }}
#
# Trigger it on `push` with `branches: ['**']` and `tags: ['**']` so every ref
# lands. The mirror is one-way and authoritative: anything pushed directly to a
# target that GitHub does not have is overwritten, and with `prune: true`
# (default) refs deleted here are deleted there. These are read-only copies.
#
# Because they are read-only, `disable_pull_requests` (default true) turns the
# pull/merge request feature off on Codeberg and GitLab. A PR merged on a mirror
# is destroyed by the next force-push, and unlike GitHub -- where a workflow can
# close one with an explanation -- neither platform can refuse it, so the button
# comes off instead. Issues stay on, and so does forking.
#
# Two things this does NOT do the obvious way, both deliberate:
#
#   1. It bare-clones the source instead of using actions/checkout + `git push
#      --all`. A checkout creates exactly ONE local branch (the rest stay as
#      remote-tracking refs), so `--all` silently mirrors a single branch and
#      quietly loses every other one. The bare clone carries all heads + tags.
#   2. Every API call uses `--fail-with-body`. Plain `curl -s` exits 0 on 401 /
#      404 / 500, so `set -euo pipefail` does NOT catch a revoked token or a
#      missing scope -- the step goes green having synced nothing.
#
# Tokens need repo-create + repo-write scope on each platform. GitLab's project
# creation specifically needs `api` scope, not just `write_repository`.

on:
  workflow_call:
    inputs:
      codeberg_enabled:
        description: "Mirror to Codeberg"
        required: false
        type: boolean
        default: false

      gitlab_enabled:
        description: "Mirror to GitLab"
        required: false
        type: boolean
        default: false

      gitee_enabled:
        description: "Mirror to Gitee"
        required: false
        type: boolean
        default: false

      create_missing:
        description: "Create the repo on the target when it does not exist yet"
        required: false
        type: boolean
        default: true

      sync_metadata:
        description: "Sync the GitHub description (and topics/project URL, where supported)"
        required: false
        type: boolean
        default: true

      disable_pull_requests:
        description: "Turn the pull/merge request feature OFF on the mirror. A mirror is force-pushed from the source, so anything merged here is destroyed on the next sync -- and neither Gitea nor GitLab can reject a PR the way a GitHub workflow can, so the only honest answer is to remove the button. Issues stay enabled, and so does forking."
        required: false
        type: boolean
        default: true

      description_prefix:
        description: "Prepended to the synced description. Empty by default."
        required: false
        type: string
        default: ""

      description_max_length:
        description: "Cap on the synced description, in CHARACTERS (not bytes). Over it, the text is cut and ends in '...'. GitLab and Gitee both reject anything past 2000."
        required: false
        type: number
        default: 2000

      prune:
        description: "Delete refs on the target that no longer exist here"
        required: false
        type: boolean
        default: true

      max_attempts:
        description: "Attempts for each network operation before giving up, including the first. The clone and the push are pure network and fail transiently — a registry blip should cost a retry, not the whole mirror for that run."
        required: false
        type: number
        default: 3

      backoff_seconds:
        description: "Base delay between attempts. Doubles each retry, so 10 gives 10s then 20s."
        required: false
        type: number
        default: 10

      readme_url_header:
        description: "On targets with no project-URL field (GitLab only), prepend this repo's homepage as a link at the top of the README on the mirror's default branch. Costs the mirror one extra commit on that branch; every other branch, tag and file stays byte-identical. No effect when the repo has no homepage set or no README."
        required: false
        type: boolean
        default: true

      codeberg_url:
        description: "Base URL of the Codeberg/Gitea instance"
        required: false
        type: string
        default: "https://codeberg.org"

      target_owner:
        description: "Owner/namespace on Codeberg + GitLab (defaults to this repo's owner)"
        required: false
        type: string
        default: ""

      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

    secrets:
      codeberg_token:
        description: "Codeberg token with repo write + create scope"
        required: false
      gitlab_token:
        description: "GitLab PAT with api scope (project creation needs api, not just write_repository)"
        required: false
      gitee_token:
        description: "Gitee private access token with projects scope"
        required: false
      gitee_user:
        description: "Gitee username for the push (defaults to the target owner)"
        required: false

permissions: {}

# A commit and its tag pushed together start two runs about a second apart. Both
# would look the target up, both see 404, and both try to create it -- one wins
# and the other fails. Serialize per caller repo and platform so the second run
# queues behind the first and finds the repo already there. Nothing is cancelled:
# each run mirrors a real ref and the later one must still push its own.
concurrency:
  group: git-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  codeberg:
    if: inputs.codeberg_enabled
    name: Codeberg
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.codeberg_token }}
          BASE: ${{ inputs.codeberg_url }}
          OWNER: ${{ inputs.target_owner != '' && inputs.target_owner || github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SOURCE: ${{ github.repository }}
          CREATE_MISSING: ${{ inputs.create_missing }}
          SYNC_METADATA: ${{ inputs.sync_metadata }}
          DISABLE_PULL_REQUESTS: ${{ inputs.disable_pull_requests }}
          PREFIX: ${{ inputs.description_prefix }}
          MAXLEN: ${{ inputs.description_max_length }}
          PRUNE: ${{ inputs.prune }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          BACKOFF: ${{ inputs.backoff_seconds }}
        run: |
          set -euo pipefail

          # The clone and the push are pure network and fail transiently:
          # registry 502s, TLS resets, a brief upstream outage. Losing one costs
          # the entire mirror for that run, so they get retried with exponential
          # backoff. A genuinely bad token also retries -- it fails the same way
          # from here -- which just means a real auth failure takes
          # max_attempts tries instead of one. That is cheap next to dropping a
          # mirror on a blip.
          retry() {
            local attempt=1 delay

            while true; do
              if "$@"; then
                return 0
              fi

              if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                echo "::error::gave up after ${MAX_ATTEMPTS} attempt(s): $*" >&2

                return 1
              fi

              delay=$((BACKOFF * (2 ** (attempt - 1))))
              echo "attempt ${attempt} failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          if [ -z "${TOKEN}" ]; then
            echo "::error::codeberg_enabled is true but the codeberg_token secret is empty" >&2
            exit 1
          fi

          api="${BASE}/api/v1"
          auth=(-H "Authorization: token ${TOKEN}")

          status=$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" \
            "${api}/repos/${OWNER}/${REPO}")

          if [ "${status}" = "404" ]; then
            if [ "${CREATE_MISSING}" != "true" ]; then
              echo "::error::${OWNER}/${REPO} does not exist on Codeberg and create_missing is false" >&2
              exit 1
            fi

            echo "creating ${OWNER}/${REPO} on Codeberg"
            if ! created=$(curl -sS --fail-with-body -X POST "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg n "${REPO}" '{name: $n, private: false, auto_init: false}')" \
              "${api}/user/repos" 2>&1); then

              # Concurrency should keep runs from racing here, but a caller can
              # still start two by other means. If the repo exists now, someone
              # else created it and this run can carry on.
              recheck=$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" \
                "${api}/repos/${OWNER}/${REPO}")

              if [ "${recheck}" = "200" ]; then
                echo "already created by a concurrent run; continuing"
              else
                echo "::error::Codeberg create failed: ${created}" >&2
                exit 1
              fi
            fi
          elif [ "${status}" != "200" ]; then
            echo "::error::Codeberg lookup returned HTTP ${status}" >&2
            exit 1
          fi

          # Its own call rather than a field on the metadata PATCH below: that
          # one carries a description and can be refused for reasons that have
          # nothing to do with this, and this must not ride on it.
          if [ "${DISABLE_PULL_REQUESTS}" = "true" ]; then
            if ! out=$(curl -sS --fail-with-body -o /dev/null -X PATCH "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d '{"has_pull_requests": false}' \
              "${api}/repos/${OWNER}/${REPO}" 2>&1); then
              echo "::error::Codeberg pull-request disable failed: ${out}" >&2
              exit 1
            fi

            echo "pull requests disabled on the Codeberg mirror"
          fi

          if [ "${SYNC_METADATA}" = "true" ]; then
            meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), homepage: (.homepage // ""), topics: (.topics // [])}')

            # Mark the copy, then cap it. jq counts codepoints, so the cap is in
            # characters like the platforms' own limits -- bash ${#var} would be
            # bytes and would cut a multi-byte description short.
            description=$(printf '%s' "${meta}" | jq -r --arg p "${PREFIX}" --argjson max "${MAXLEN}" '
              (if .description == "" then ($p | sub(" +$"; "")) else ($p + .description) end)
              | if length > $max then .[0:($max - 3)] + "..." else . end
            ')

            # Gitea calls the project URL `website`.
            if ! out=$(curl -sS --fail-with-body -o /dev/null -X PATCH "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(printf '%s' "${meta}" | jq -c --arg d "${description}" '{description: $d, website: .homepage}')" \
              "${api}/repos/${OWNER}/${REPO}" 2>&1); then
              echo "::error::Codeberg description/website sync failed: ${out}" >&2
              exit 1
            fi

            # Gitea validates every topic and rejects the WHOLE array if one is
            # bad: lowercase, [a-z0-9-] only, must start alphanumeric, <=35
            # chars, <=25 topics. Normalize rather than lose the lot.
            topics=$(printf '%s' "${meta}" | jq -c '
              [ .topics[]
                | ascii_downcase
                | gsub("[^a-z0-9-]"; "-")
                | sub("^-+"; "")
                | sub("-+$"; "")
                | .[0:35]
              ]
              | map(select(length > 0))
              | unique
              | .[0:25]
            ')

            # Normalizing covers the documented rules, but Gitea can still
            # refuse the array for a reason the normalizer does not model. The
            # description is already synced by this point and the refs are the
            # point of the job, so a rejected topic list is a warning, not a
            # failed mirror.
            if ! out=$(curl -sS --fail-with-body -o /dev/null -X PUT "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --argjson t "${topics}" '{topics: $t}')" \
              "${api}/repos/${OWNER}/${REPO}/topics" 2>&1); then
              echo "::warning::Codeberg rejected the topics (${out}); description is synced, topics skipped" >&2
            fi
          fi

          host="${BASE#https://}"
          retry git clone --bare --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE}.git" src.git
          cd src.git

          prune_flag=()
          if [ "${PRUNE}" = "true" ]; then prune_flag=(--prune); fi

          retry git push --force "${prune_flag[@]}" \
            "https://${TOKEN}@${host}/${OWNER}/${REPO}.git" \
            "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"

          echo "mirrored $(git for-each-ref --format='%(refname)' refs/heads | wc -l) branches, $(git for-each-ref --format='%(refname)' refs/tags | wc -l) tags to Codeberg"

  gitlab:
    if: inputs.gitlab_enabled
    name: GitLab
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.gitlab_token }}
          OWNER: ${{ inputs.target_owner != '' && inputs.target_owner || github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SOURCE: ${{ github.repository }}
          CREATE_MISSING: ${{ inputs.create_missing }}
          SYNC_METADATA: ${{ inputs.sync_metadata }}
          DISABLE_PULL_REQUESTS: ${{ inputs.disable_pull_requests }}
          PREFIX: ${{ inputs.description_prefix }}
          MAXLEN: ${{ inputs.description_max_length }}
          PRUNE: ${{ inputs.prune }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          BACKOFF: ${{ inputs.backoff_seconds }}
          README_URL_HEADER: ${{ inputs.readme_url_header }}
        run: |
          set -euo pipefail

          # The clone and the push are pure network and fail transiently:
          # registry 502s, TLS resets, a brief upstream outage. Losing one costs
          # the entire mirror for that run, so they get retried with exponential
          # backoff. A genuinely bad token also retries -- it fails the same way
          # from here -- which just means a real auth failure takes
          # max_attempts tries instead of one. That is cheap next to dropping a
          # mirror on a blip.
          retry() {
            local attempt=1 delay

            while true; do
              if "$@"; then
                return 0
              fi

              if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                echo "::error::gave up after ${MAX_ATTEMPTS} attempt(s): $*" >&2

                return 1
              fi

              delay=$((BACKOFF * (2 ** (attempt - 1))))
              echo "attempt ${attempt} failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          if [ -z "${TOKEN}" ]; then
            echo "::error::gitlab_enabled is true but the gitlab_token secret is empty" >&2
            exit 1
          fi

          auth=(-H "PRIVATE-TOKEN: ${TOKEN}")

          # GitLab looks projects up by URL-encoded path: owner/repo -> owner%2Frepo
          encoded=$(jq -rn --arg p "${OWNER}/${REPO}" '$p | @uri')

          status=$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" \
            "https://gitlab.com/api/v4/projects/${encoded}")

          if [ "${status}" = "404" ]; then
            if [ "${CREATE_MISSING}" != "true" ]; then
              echo "::error::${OWNER}/${REPO} does not exist on GitLab and create_missing is false" >&2
              exit 1
            fi

            echo "creating ${OWNER}/${REPO} on GitLab"
            if ! created=$(curl -sS --fail-with-body -X POST "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg n "${REPO}" '{name: $n, path: $n, visibility: "public"}')" \
              "https://gitlab.com/api/v4/projects" 2>&1); then

              # Concurrency should keep runs from racing here, but a caller can
              # still start two by other means. If the project exists now,
              # someone else created it and this run can carry on.
              recheck=$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" \
                "https://gitlab.com/api/v4/projects/${encoded}")

              if [ "${recheck}" = "200" ]; then
                echo "already created by a concurrent run; continuing"
              else
                echo "::error::GitLab create failed: ${created}" >&2
                exit 1
              fi
            fi
          elif [ "${status}" != "200" ]; then
            echo "::error::GitLab lookup returned HTTP ${status}" >&2
            exit 1
          fi

          # GitLab protects the default branch of a new project automatically,
          # with allow_force_push false. A mirror force-pushes, so every run
          # after the very first one is rejected with "You are not allowed to
          # force push code to a protected branch". The first run succeeds
          # because it CREATES the branch rather than force-pushing over it,
          # which makes this fail silently at setup time and only bite later --
          # the mirror sits frozen at its initial snapshot looking healthy.
          #
          # Branch protection is meaningless on a read-only mirror, so every
          # protected branch is removed rather than just the default one:
          # wildcard rules would reject the same way.
          protected=$(curl -sS "${auth[@]}" \
            "https://gitlab.com/api/v4/projects/${encoded}/protected_branches" \
            | jq -r '.[].name' 2>/dev/null || true)

          if [ -n "${protected}" ]; then
            while IFS= read -r branch_name; do
              [ -n "${branch_name}" ] || continue

              # The name goes in a URL path, so a wildcard rule like "release/*"
              # has to be encoded or the request 404s on the slash.
              encoded_branch=$(jq -rn --arg b "${branch_name}" '$b|@uri')

              if curl -sS --fail-with-body -o /dev/null -X DELETE "${auth[@]}" \
                "https://gitlab.com/api/v4/projects/${encoded}/protected_branches/${encoded_branch}" 2>&1; then
                echo "unprotected ${branch_name}"
              else
                echo "::warning::could not unprotect ${branch_name}; a force push to it will be rejected"
              fi
            done <<< "${protected}"
          fi

          # Its own call rather than a field on the metadata PUT below: that one
          # carries the topic array, which GitLab validates as a unit and can
          # reject wholesale, and this must not ride on it.
          if [ "${DISABLE_PULL_REQUESTS}" = "true" ]; then
            if ! out=$(curl -sS --fail-with-body -o /dev/null -X PUT "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d '{"merge_requests_access_level": "disabled"}' \
              "https://gitlab.com/api/v4/projects/${encoded}" 2>&1); then
              echo "::error::GitLab merge-request disable failed: ${out}" >&2
              exit 1
            fi

            echo "merge requests disabled on the GitLab mirror"
          fi

          # Read outside the sync_metadata guard: the README injection below
          # needs the homepage even when project-metadata syncing is off.
          homepage=$(gh api "repos/${SOURCE}" --jq '.homepage // ""')

          if [ "${SYNC_METADATA}" = "true" ]; then
            meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), topics: (.topics // [])}')

            # Mark the copy, then cap it. jq counts codepoints, so the cap is in
            # characters like GitLab's own limit -- bash ${#var} would be bytes.
            description=$(printf '%s' "${meta}" | jq -r --arg p "${PREFIX}" --argjson max "${MAXLEN}" '
              (if .description == "" then ($p | sub(" +$"; "")) else ($p + .description) end)
              | if length > $max then .[0:($max - 3)] + "..." else . end
            ')

            # The happy path is one call with everything. GitLab validates the
            # topic array as a unit and rejects the whole PUT with an opaque 422
            # if it dislikes any single entry -- and a topic that is perfectly
            # legal on GitHub can be refused here, with nothing in the response
            # saying which one.
            if ! out=$(curl -sS --fail-with-body -o /dev/null -X PUT "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(printf '%s' "${meta}" | jq -c --arg d "${description}" '{description: $d, topics: .topics}')" \
              "https://gitlab.com/api/v4/projects/${encoded}" 2>&1); then
              echo "::warning::GitLab refused the metadata as a whole (${out}); syncing the description, then adding topics one at a time" >&2

              # The bulk call is atomic, so its failure means the description
              # did not land either. Set it on its own first.
              if ! out=$(curl -sS --fail-with-body -o /dev/null -X PUT "${auth[@]}" \
                -H "Content-Type: application/json" \
                -d "$(jq -nc --arg d "${description}" '{description: $d}')" \
                "https://gitlab.com/api/v4/projects/${encoded}" 2>&1); then
                echo "::error::GitLab metadata sync failed: ${out}" >&2
                exit 1
              fi

              # Then grow the list one topic at a time, keeping whatever is
              # accepted and dropping only what is actually refused. Each PUT
              # replaces the whole array, so the candidate is always the set
              # accepted so far plus the one being tried.
              accepted='[]'
              rejected=()

              while IFS= read -r topic; do
                [ -n "${topic}" ] || continue
                candidate=$(jq -nc --argjson a "${accepted}" --arg t "${topic}" '$a + [$t]')

                if curl -sS --fail-with-body -o /dev/null -X PUT "${auth[@]}" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -nc --argjson t "${candidate}" '{topics: $t}')" \
                  "https://gitlab.com/api/v4/projects/${encoded}" >/dev/null 2>&1; then
                  accepted="${candidate}"
                else
                  rejected+=("${topic}")
                fi
              done < <(printf '%s' "${meta}" | jq -r '.topics[]')

              kept=$(printf '%s' "${accepted}" | jq 'length')
              echo "description synced; ${kept} topic(s) kept"

              if ((${#rejected[@]})); then
                echo "::warning::GitLab refused these topics, they were skipped: ${rejected[*]}" >&2
              fi
            fi
          fi

          retry git clone --bare --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE}.git" src.git
          cd src.git

          # GitLab is the only target with no project-URL field, so a repo's
          # homepage has nowhere to live here. Put it at the top of the README
          # on the default branch instead -- that page IS the project landing
          # page on GitLab, so it is the one place a visitor will see it.
          #
          # This is the one way a GitLab mirror deliberately differs from its
          # source: the default branch carries one extra commit. Every other
          # branch, every tag, and every other file are byte-identical.
          if [ "${README_URL_HEADER}" = "true" ] && [ -n "${homepage}" ]; then
            branch=$(gh api "repos/${SOURCE}" --jq '.default_branch')

            readme=$(git ls-tree --name-only "${branch}" \
              | grep -iE '^readme(\.md|\.markdown|\.rst|\.txt)?$' | head -1 || true)

            if [ -z "${readme}" ]; then
              echo "::warning::no README on ${branch}; project URL not injected"
            else
              mode=$(git ls-tree "${branch}" -- "${readme}" | awk '{print $1}')

              git cat-file -p "${branch}:${readme}" >/tmp/readme.orig
              {
                printf '[%s](%s)\n\n' "${homepage}" "${homepage}"
                cat /tmp/readme.orig
              } >/tmp/readme.new

              blob=$(git hash-object -w /tmp/readme.new)

              GIT_INDEX_FILE=/tmp/mirror.index
              export GIT_INDEX_FILE
              git read-tree "${branch}"
              git update-index --add --cacheinfo "${mode},${blob},${readme}"
              tree=$(git write-tree)
              unset GIT_INDEX_FILE
              rm -f /tmp/mirror.index

              # Dated from the source tip rather than "now", so the injected
              # commit hashes the same on every run for an unchanged source.
              # Otherwise each mirror run would rewrite the branch with a new
              # SHA and every clone of the mirror would need a force pull.
              tip_date=$(git show -s --format=%cI "${branch}")

              commit=$(GIT_AUTHOR_NAME="git-mirror" \
                GIT_AUTHOR_EMAIL="git-mirror@noreply.invalid" \
                GIT_AUTHOR_DATE="${tip_date}" \
                GIT_COMMITTER_NAME="git-mirror" \
                GIT_COMMITTER_EMAIL="git-mirror@noreply.invalid" \
                GIT_COMMITTER_DATE="${tip_date}" \
                git commit-tree "${tree}" -p "$(git rev-parse "${branch}")" \
                  -m "docs: link the project page at the top of the README" \
                  -m "GitLab has no project-URL field, so the homepage set on the GitHub original has nowhere else to appear on this mirror. Added by the mirror job; it is not present upstream.")

              git update-ref "refs/heads/${branch}" "${commit}"
              echo "injected project URL into ${readme} on ${branch}"
            fi
          fi

          prune_flag=()
          if [ "${PRUNE}" = "true" ]; then prune_flag=(--prune); fi

          retry git push --force "${prune_flag[@]}" \
            "https://oauth2:${TOKEN}@gitlab.com/${OWNER}/${REPO}.git" \
            "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"

          echo "mirrored $(git for-each-ref --format='%(refname)' refs/heads | wc -l) branches, $(git for-each-ref --format='%(refname)' refs/tags | wc -l) tags to GitLab"

  gitee:
    if: inputs.gitee_enabled
    name: Gitee
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.gitee_token }}
          OWNER: ${{ inputs.target_owner != '' && inputs.target_owner || github.repository_owner }}
          USERNAME: ${{ secrets.gitee_user }}
          REPO: ${{ github.event.repository.name }}
          SOURCE: ${{ github.repository }}
          CREATE_MISSING: ${{ inputs.create_missing }}
          SYNC_METADATA: ${{ inputs.sync_metadata }}
          PREFIX: ${{ inputs.description_prefix }}
          MAXLEN: ${{ inputs.description_max_length }}
          PRUNE: ${{ inputs.prune }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          BACKOFF: ${{ inputs.backoff_seconds }}
        run: |
          set -euo pipefail

          # The clone and the push are pure network and fail transiently:
          # registry 502s, TLS resets, a brief upstream outage. Losing one costs
          # the entire mirror for that run, so they get retried with exponential
          # backoff. A genuinely bad token also retries -- it fails the same way
          # from here -- which just means a real auth failure takes
          # max_attempts tries instead of one. That is cheap next to dropping a
          # mirror on a blip.
          retry() {
            local attempt=1 delay

            while true; do
              if "$@"; then
                return 0
              fi

              if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
                echo "::error::gave up after ${MAX_ATTEMPTS} attempt(s): $*" >&2

                return 1
              fi

              delay=$((BACKOFF * (2 ** (attempt - 1))))
              echo "attempt ${attempt} failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          }

          if [ -z "${TOKEN}" ]; then
            echo "::error::gitee_enabled is true but the gitee_token secret is empty" >&2
            exit 1
          fi

          # Gitee namespaces repos under the username, so the owner is the sane
          # default for the push identity when gitee_user is not given.
          user="${USERNAME:-${OWNER}}"

          api="https://gitee.com/api/v5"
          auth=(-H "Authorization: token ${TOKEN}")

          status=$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" \
            "${api}/repos/${OWNER}/${REPO}")

          if [ "${status}" = "404" ]; then
            if [ "${CREATE_MISSING}" != "true" ]; then
              echo "::error::${OWNER}/${REPO} does not exist on Gitee and create_missing is false" >&2
              exit 1
            fi

            echo "creating ${OWNER}/${REPO} on Gitee"
            if ! created=$(curl -sS --fail-with-body -X POST "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg n "${REPO}" '{name: $n, path: $n, private: false}')" \
              "${api}/user/repos" 2>&1); then

              # Concurrency should keep runs from racing here, but a caller can
              # still start two by other means. Gitee answers a duplicate create
              # with 422; if the repo exists now, this run can carry on.
              recheck=$(curl -sS -o /dev/null -w "%{http_code}" "${auth[@]}" \
                "${api}/repos/${OWNER}/${REPO}")

              if [ "${recheck}" = "200" ]; then
                echo "already created by a concurrent run; continuing"
              else
                echo "::error::Gitee create failed: ${created}" >&2
                exit 1
              fi
            fi

            # Gitee silently creates the repo PRIVATE when the account cannot
            # publish: it requires a bound mobile number before any repo can be
            # public, and it ignores `private: false` rather than refusing. The
            # mirror still works, but the result is invisible to everyone else,
            # so say so instead of leaving a private repo looking like success.
            visibility=$(curl -sS "${auth[@]}" "${api}/repos/${OWNER}/${REPO}" \
              | jq -r '.private')

            if [ "${visibility}" = "true" ]; then
              echo "::warning::Gitee created ${OWNER}/${REPO} as PRIVATE and ignored the public setting. Gitee requires a mobile number bound to the account before a repository can be public — bind one at gitee.com and flip the repo to public, or the mirror stays invisible."
            fi
          elif [ "${status}" != "200" ]; then
            echo "::error::Gitee lookup returned HTTP ${status}" >&2
            exit 1
          fi

          if [ "${SYNC_METADATA}" = "true" ]; then
            # Gitee has no topics field on the repo-edit endpoint, so this syncs
            # the description and the project URL (which it calls `homepage`).
            # `name` is REQUIRED on the PATCH -- unlike Gitea and GitLab, a body
            # without it is rejected -- so it is sent unchanged.
            meta=$(gh api "repos/${SOURCE}" --jq '{description: (.description // ""), homepage: (.homepage // "")}')

            # Mark the copy, then cap it. Gitee states its own limit in
            # characters ("最长为 2000 个字符"), and jq counts codepoints, so the
            # two agree -- bash ${#var} would be bytes and would cut short.
            description=$(printf '%s' "${meta}" | jq -r --arg p "${PREFIX}" --argjson max "${MAXLEN}" '
              (if .description == "" then ($p | sub(" +$"; "")) else ($p + .description) end)
              | if length > $max then .[0:($max - 3)] + "..." else . end
            ')

            if ! out=$(curl -sS --fail-with-body -o /dev/null -X PATCH "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$(printf '%s' "${meta}" | jq -c --arg n "${REPO}" --arg d "${description}" '{name: $n, description: $d, homepage: .homepage}')" \
              "${api}/repos/${OWNER}/${REPO}" 2>&1); then
              echo "::error::Gitee description/homepage sync failed: ${out}" >&2
              exit 1
            fi
          fi

          retry git clone --bare --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE}.git" src.git
          cd src.git

          prune_flag=()
          if [ "${PRUNE}" = "true" ]; then prune_flag=(--prune); fi

          retry git push --force "${prune_flag[@]}" \
            "https://${user}:${TOKEN}@gitee.com/${OWNER}/${REPO}.git" \
            "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"

          echo "mirrored $(git for-each-ref --format='%(refname)' refs/heads | wc -l) branches, $(git for-each-ref --format='%(refname)' refs/tags | wc -l) tags to Gitee"
