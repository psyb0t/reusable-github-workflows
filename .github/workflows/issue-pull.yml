name: Issue Pull

# Copies issues and replies from the Codeberg and GitLab mirrors into GitHub,
# so the mirrors can carry a conversation without anyone having to watch them.
#
# Direction matters: this only ever READS the mirrors and WRITES here. Nothing
# is pushed back, so no GitHub credential ever leaves this runner -- the relayed
# issue is opened with the built-in GITHUB_TOKEN, which is scoped to this repo
# and expires with the job. Reading public issues needs no token at all; the
# mirror tokens are used for the higher rate limit and for source-note APIs
# that do not allow anonymous reads.
#
# The relayed issue is authored by github-actions[bot], never by the repo owner:
# an issue that claims to be written by you but was not is a lie you have to
# live with forever, and a bot-authored issue does not re-trigger workflows.
#
# State lives in the relayed issues themselves. Each issue carries a marker
# with the source URL. Each relayed reply carries its source comment ID. The
# next run reads those markers, so there is no cache to evict, no state file to
# corrupt, and a run that dies halfway simply picks up where it left off.

on:
  workflow_call:
    inputs:
      codeberg_enabled:
        description: "Pull issues from the Codeberg mirror"
        required: false
        type: boolean
        default: true

      gitlab_enabled:
        description: "Pull issues from the GitLab mirror"
        required: false
        type: boolean
        default: true

      codeberg_url:
        description: "Base URL of the Codeberg/Gitea instance"
        required: false
        type: string
        default: "https://codeberg.org"

      target_owner:
        description: "Owner on Codeberg + GitLab (defaults to this repo's owner)"
        required: false
        type: string
        default: ""

      jitter_seconds:
        description: "Upper bound on a random delay before the first request. Every repo runs this on the same 6-hourly cadence, and GitHub fires a whole account's crons together; without a jitter that is one thundering herd per platform, every six hours, forever."
        required: false
        type: number
        default: 600

      label:
        description: "Label put on every relayed issue. Also the query that finds them again, so changing it orphans everything relayed under the old one."
        required: false
        type: string
        default: "relayed"

      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      codeberg_token:
        description: "Optional. Used for authenticated mirror reads; anonymous fallback remains available."
        required: false

      gitlab_token:
        description: "Optional. Needed when GitLab restricts note reads; anonymous fallback remains available."
        required: false

concurrency:
  group: issue-pull-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  pull:
    name: Pull issues
    runs-on: ${{ inputs.runs_on }}
    permissions:
      issues: write
    steps:
      - name: Relay issues from the mirrors
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          OWNER: ${{ inputs.target_owner != '' && inputs.target_owner || github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          CODEBERG_ENABLED: ${{ inputs.codeberg_enabled }}
          GITLAB_ENABLED: ${{ inputs.gitlab_enabled }}
          CODEBERG_BASE: ${{ inputs.codeberg_url }}
          CODEBERG_TOKEN: ${{ secrets.codeberg_token }}
          GITLAB_TOKEN: ${{ secrets.gitlab_token }}
          JITTER: ${{ inputs.jitter_seconds }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail

          relay_tmp=$(mktemp -d)
          trap 'rm -rf "${relay_tmp}"' EXIT

          if [ "${JITTER}" -gt 0 ]; then
            delay=$((RANDOM % JITTER))
            echo "sleeping ${delay}s so every repo does not hit the mirrors at once"
            sleep "${delay}"
          fi

          # Normalised shape both platforms are flattened into, so the relay
          # logic below never has to care which one an issue came from:
          #   {origin, url, source_id, title, body, author, author_url, state,
          #    comments, opened, closed, confidential}
          foreign='[]'

          # These issues are public, so the token buys nothing but a higher rate
          # limit -- and an under-scoped one is WORSE than none, because it turns
          # a request that would have succeeded anonymously into a 403. So every
          # authenticated read falls back to an anonymous one rather than giving
          # up on the platform for that run.
          # Returns a JSON array on stdout, or non-zero with the offending
          # payload on stdout for the caller to put in a warning. Diagnostics go
          # to stderr and MUST NOT be captured by the caller.
          read_issues() {
            local url="$1" token_header="$2" body

            if [ -n "${token_header}" ]; then
              if body=$(curl -sS --fail-with-body -H "${token_header}" "${url}"); then
                emit_json_array "${body}"

                return $?
              fi

              echo "::warning::authenticated read refused (${body}); retrying anonymously" >&2
            fi

            if ! body=$(curl -sS --fail-with-body "${url}"); then
              printf '%s' "${body}"

              return 1
            fi

            emit_json_array "${body}"
          }

          # A mirror answering 200 with an HTML error page, a rate-limit notice,
          # or an empty body used to reach jq unchecked and abort the whole run
          # under `set -e`. One flaky platform should cost that platform's side
          # of the relay, not the job.
          emit_json_array() {
            local body="$1"

            if ! printf '%s' "${body}" | jq -e 'type == "array"' >/dev/null 2>&1; then
              printf '%s' "${body}"

              return 1
            fi

            printf '%s' "${body}"
          }

          # Both APIs paginate note lists. Keep asking until a short page
          # arrives, because leaving a reply past page one behind is worse than
          # relaying no replies at all. The caller supplies a literal
          # __PAGE__ placeholder so an instance URL never becomes a printf
          # format string.
          read_pages() {
            local url_template="$1" token_header="$2" page=1 all='[]' page_url page_body count

            while :; do
              page_url="${url_template/__PAGE__/${page}}"
              if ! page_body=$(read_issues "${page_url}" "${token_header}"); then
                printf '%s' "${page_body}"

                return 1
              fi

              all=$(jq -cn --argjson all "${all}" --argjson page "${page_body}" '$all + $page')
              count=$(printf '%s' "${page_body}" | jq 'length')
              if [ "${count}" -lt 100 ]; then
                break
              fi

              page=$((page + 1))
            done

            printf '%s' "${all}"
          }

          write_issue_body() {
            local item="$1" destination="$2" author author_url body opened origin url confidential

            author=$(printf '%s' "${item}" | jq -r '.author')
            author_url=$(printf '%s' "${item}" | jq -r '.author_url')
            body=$(printf '%s' "${item}" | jq -r '.body')
            opened=$(printf '%s' "${item}" | jq -r '.opened')
            origin=$(printf '%s' "${item}" | jq -r '.origin')
            url=$(printf '%s' "${item}" | jq -r '.url')
            confidential=$(printf '%s' "${item}" | jq -r '.confidential')

            if [ "${confidential}" = "true" ]; then
              printf 'A confidential issue exists on %s. Its details stay private at the source.\n\n[Open the confidential source issue](%s)\n\n<!-- issue-pull:%s -->\n' \
                "${origin}" "${url}" "${url}" >"${destination}"

              return
            fi

            body=$(rewrite_root_relative_markdown_links "${body}" "${url}")

            printf 'Opened by **[%s @%s](%s)** on %s.\nSource: [%s issue](%s)\n\n%s\n\n<!-- issue-pull:%s -->\n' \
              "${origin}" "${author}" "${author_url}" "${opened}" "${origin}" "${url}" "${body}" "${url}" \
              >"${destination}"
          }

          # A source issue commonly links its uploaded proof as /uploads/... .
          # GitHub would resolve that path against github.com after the copy,
          # which makes a valid GitLab or Codeberg link point at the wrong site.
          # Rewrite only Markdown destinations with one leading slash. Network
          # paths beginning with // stay untouched.
          rewrite_root_relative_markdown_links() {
            local body="$1" source_url="$2" source_origin

            source_origin=$(jq -nr --arg source_url "${source_url}" \
              '$source_url | capture("^(?<origin>https?://[^/]+)").origin')
            printf '%s' "${body}" | jq -Rrs --arg origin "${source_origin}" \
              'gsub("\\]\\(/(?!/)"; "](" + $origin + "/")'
          }

          sync_source_comments() {
            local number="$1" item="$2" origin source_id source_url confidential comments comment marker
            local comment_id author author_url comment_url created body existing existing_id
            local issue_comments stale_marker stale_comment_id

            origin=$(printf '%s' "${item}" | jq -r '.origin')
            source_id=$(printf '%s' "${item}" | jq -r '.source_id')
            source_url=$(printf '%s' "${item}" | jq -r '.url')
            confidential=$(printf '%s' "${item}" | jq -r '.confidential')

            case "${origin}" in
              Codeberg)
                if ! comments=$(read_pages \
                  "${CODEBERG_BASE}/api/v1/repos/${OWNER}/${REPO}/issues/${source_id}/comments?limit=100&page=__PAGE__" \
                  "${cb_header}"); then
                  echo "::warning::Codeberg comments for ${source_url} could not be read: ${comments}"

                  return 0
                fi

                comments=$(printf '%s' "${comments}" | jq -c '
                  map({
                    id: (.id | tostring),
                    body: (.body // ""),
                    author: (.user.login // "unknown"),
                    author_url: (.user.html_url // ""),
                    url: (.html_url // ""),
                    created: (.created_at // "")
                  })
                ')
                ;;
              GitLab)
                if ! comments=$(read_pages \
                  "https://gitlab.com/api/v4/projects/${encoded}/issues/${source_id}/notes?activity_filter=only_comments&sort=asc&order_by=created_at&per_page=100&page=__PAGE__" \
                  "${gl_header}"); then
                  echo "::warning::GitLab comments for ${source_url} could not be read: ${comments}"

                  return 0
                fi

                comments=$(printf '%s' "${comments}" | jq -c --arg source_url "${source_url}" '
                  map(select(.system != true) | {
                    id: (.id | tostring),
                    body: (.body // ""),
                    author: (.author.username // "unknown"),
                    author_url: (.author.web_url // ("https://gitlab.com/" + (.author.username // "unknown"))),
                    url: (.web_url // ($source_url + "#note_" + (.id | tostring))),
                    created: (.created_at // "")
                  })
                ')
                ;;
              *)
                echo "::warning::unsupported source origin: ${origin}"

                return 0
                ;;
            esac

            issue_comments=$(gh api --paginate --slurp \
              "repos/${SOURCE}/issues/${number}/comments?per_page=100" | jq -c 'add // []')

            if [ "${confidential}" = "true" ]; then
              # A previously public issue may become confidential. Remove only
              # imported bot replies from that source, never a human's comment.
              stale_marker="<!-- issue-pull-comment:${origin}:${source_id}:"
            else
              # The reverse transition replaces generic relay notes with the
              # normal, source-attributed form.
              stale_marker="<!-- issue-pull-confidential-comment:${origin}:${source_id}:"
            fi

            while IFS= read -r stale_comment_id; do
              gh api --method DELETE "repos/${SOURCE}/issues/comments/${stale_comment_id}" >/dev/null
              comments_removed=$((comments_removed + 1))
            done < <(printf '%s' "${issue_comments}" | jq -r --arg marker "${stale_marker}" '
              .[]
              | select(
                  .user.login == "github-actions[bot]"
                  and (.body != null and (.body | contains($marker)))
                )
              | .id
            ')

            if [ "${confidential}" = "true" ]; then
              comments=$(printf '%s' "${comments}" | jq -c 'map({id})')
            fi

            while IFS= read -r comment; do
              comment_id=$(printf '%s' "${comment}" | jq -r '.id')

              if [ "${confidential}" = "true" ]; then
                marker="<!-- issue-pull-confidential-comment:${origin}:${source_id}:${comment_id} -->"
                printf 'A confidential-source reply was posted. Its details stay private at the source.\n\n[Open the confidential source issue](%s)\n\n%s\n' \
                  "${source_url}" "${marker}" >"${relay_tmp}/comment.md"
                jq -n --rawfile body "${relay_tmp}/comment.md" '{body: $body}' >"${relay_tmp}/comment.json"

                existing=$(printf '%s' "${issue_comments}" | jq -c --arg marker "${marker}" \
                  'map(select(.body != null and (.body | contains($marker)))) | first // empty')

                if [ -z "${existing}" ]; then
                  gh api --method POST "repos/${SOURCE}/issues/${number}/comments" \
                    --input "${relay_tmp}/comment.json" >/dev/null
                  comments_created=$((comments_created + 1))
                fi

                continue
              fi

              author=$(printf '%s' "${comment}" | jq -r '.author')
              author_url=$(printf '%s' "${comment}" | jq -r '.author_url')
              comment_url=$(printf '%s' "${comment}" | jq -r '.url')
              created=$(printf '%s' "${comment}" | jq -r '.created')
              body=$(printf '%s' "${comment}" | jq -r '.body')
              body=$(rewrite_root_relative_markdown_links "${body}" "${source_url}")
              marker="<!-- issue-pull-comment:${origin}:${source_id}:${comment_id} -->"

              printf '**[%s @%s](%s)** commented [on the source issue](%s) at %s.\n\n%s\n\n%s\n' \
                "${origin}" "${author}" "${author_url}" "${comment_url}" "${created}" "${body}" "${marker}" \
                >"${relay_tmp}/comment.md"
              jq -n --rawfile body "${relay_tmp}/comment.md" '{body: $body}' >"${relay_tmp}/comment.json"

              existing=$(printf '%s' "${issue_comments}" | jq -c --arg marker "${marker}" \
                'map(select(.body != null and (.body | contains($marker)))) | first // empty')

              if [ -z "${existing}" ]; then
                gh api --method POST "repos/${SOURCE}/issues/${number}/comments" \
                  --input "${relay_tmp}/comment.json" >/dev/null
                comments_created=$((comments_created + 1))

                continue
              fi

              existing_id=$(printf '%s' "${existing}" | jq -r '.id')
              printf '%s' "${existing}" | jq -rj '.body' >"${relay_tmp}/existing-comment.md"
              if ! cmp -s "${relay_tmp}/comment.md" "${relay_tmp}/existing-comment.md"; then
                gh api --method PATCH "repos/${SOURCE}/issues/comments/${existing_id}" \
                  --input "${relay_tmp}/comment.json" >/dev/null
                comments_updated=$((comments_updated + 1))
              fi
            done < <(printf '%s' "${comments}" | jq -c '.[]')
          }

          cb_header=""
          gl_header=""
          encoded="${OWNER}%2F${REPO}"

          if [ "${CODEBERG_ENABLED}" = "true" ]; then
            if [ -n "${CODEBERG_TOKEN}" ]; then
              cb_header="Authorization: token ${CODEBERG_TOKEN}"
            fi

            # state=all: a run has to see closed issues too, or it can never
            # notice that something it already relayed has since been resolved.
            # No 2>&1 here. read_issues writes its retrying-anonymously warning
            # to stderr, so merging the streams prepends that line to the JSON
            # and jq dies on the leading ':' -- which is every repo whose
            # authenticated read is refused, i.e. nearly all of them.
            if cb=$(read_issues \
              "${CODEBERG_BASE}/api/v1/repos/${OWNER}/${REPO}/issues?state=all&type=issues&limit=100" \
              "${cb_header}"); then

              foreign=$(printf '%s' "${cb}" | jq -c --argjson acc "${foreign}" '
                $acc + [ .[] | {
                  origin: "Codeberg",
                  url: .html_url,
                  source_id: (.number | tostring),
                  title: .title,
                  body: (.body // ""),
                  author: .user.login,
                  author_url: (.user.html_url // ($base + "/" + .user.login)),
                  state: .state,
                  comments: .comments,
                  opened: .created_at,
                  closed: (.closed_at // ""),
                  confidential: false
                } ]
              ' --arg base "${CODEBERG_BASE}")
            else
              echo "::warning::Codeberg issue list failed, skipping that side: ${cb}"
            fi
          fi

          if [ "${GITLAB_ENABLED}" = "true" ]; then
            if [ -n "${GITLAB_TOKEN}" ]; then
              gl_header="PRIVATE-TOKEN: ${GITLAB_TOKEN}"
            fi

            # No 2>&1 -- see the Codeberg call above.
            if gl=$(read_issues \
              "https://gitlab.com/api/v4/projects/${encoded}/issues?state=all&per_page=100" \
              "${gl_header}"); then

              foreign=$(printf '%s' "${gl}" | jq -c --argjson acc "${foreign}" '
                $acc + [ .[] | {
                  origin: "GitLab",
                  url: .web_url,
                  source_id: (.iid | tostring),
                  title: .title,
                  body: (.description // ""),
                  author: .author.username,
                  author_url: (.author.web_url // ("https://gitlab.com/" + .author.username)),
                  state: (if .state == "opened" then "open" else "closed" end),
                  comments: .user_notes_count,
                  opened: .created_at,
                  closed: (.closed_at // ""),
                  confidential: (.confidential // false)
                } ]
              ')
            else
              echo "::warning::GitLab issue list failed, skipping that side: ${gl}"
            fi
          fi

          total=$(printf '%s' "${foreign}" | jq 'length')
          echo "found ${total} issue(s) across the mirrors"

          if [ "${total}" -eq 0 ]; then
            exit 0
          fi

          # The label is how the relayed issues are found again, so it has to
          # exist before the first one is created.
          gh label create "${LABEL}" -R "${SOURCE}" \
            --description "Opened on a mirror and copied here" \
            --color "ededed" --force >/dev/null

          relayed=$(gh issue list -R "${SOURCE}" --label "${LABEL}" --state all --limit 500 \
            --json number,body,state,title)

          created=0
          closed=0
          reopened=0
          untouched=0
          issue_bodies_updated=0
          comments_created=0
          comments_updated=0
          comments_removed=0

          while IFS= read -r item; do
            url=$(printf '%s' "${item}" | jq -r '.url')
            origin=$(printf '%s' "${item}" | jq -r '.origin')
            state=$(printf '%s' "${item}" | jq -r '.state')
            confidential=$(printf '%s' "${item}" | jq -r '.confidential')
            marker="<!-- issue-pull:${url} -->"
            write_issue_body "${item}" "${relay_tmp}/issue.md"
            if [ "${confidential}" = "true" ]; then
              title="Confidential ${origin} issue received"
            else
              title=$(printf '%s' "${item}" | jq -r '.title')
            fi
            jq -n --arg title "${title}" --rawfile body "${relay_tmp}/issue.md" \
              '{title: $title, body: $body}' >"${relay_tmp}/issue.json"

            existing=$(printf '%s' "${relayed}" | jq -c --arg m "${marker}" \
              'map(select(.body != null and (.body | contains($m)))) | first // empty')

            if [ -z "${existing}" ]; then
              # Never seen it. Only worth relaying while it is still open --
              # copying in an issue that was opened and resolved entirely on the
              # mirror between two runs creates a closed issue nobody asked for.
              if [ "${state}" != "open" ]; then
                untouched=$((untouched + 1))
                continue
              fi

              origin_label="${origin,,}"
              gh label create "${origin_label}" -R "${SOURCE}" --color "ededed" --force >/dev/null

              created_url=$(gh issue create -R "${SOURCE}" \
                --title "${title}" \
                --body-file "${relay_tmp}/issue.md" \
                --label "${LABEL}" \
                --label "${origin_label}")
              number="${created_url##*/}"
              here="open"

              echo "relayed ${url}"
              created=$((created + 1))
            else
              number=$(printf '%s' "${existing}" | jq -r '.number')
              here=$(printf '%s' "${existing}" | jq -r '.state' | tr '[:upper:]' '[:lower:]')
              existing_title=$(printf '%s' "${existing}" | jq -r '.title')
              printf '%s' "${existing}" | jq -rj '.body' >"${relay_tmp}/existing-issue.md"
              if ! cmp -s "${relay_tmp}/issue.md" "${relay_tmp}/existing-issue.md" \
                || [ "${title}" != "${existing_title}" ]; then
                gh api --method PATCH "repos/${SOURCE}/issues/${number}" \
                  --input "${relay_tmp}/issue.json" >/dev/null
                issue_bodies_updated=$((issue_bodies_updated + 1))
              fi
            fi

            sync_source_comments "${number}" "${item}"

            if [ "${state}" = "closed" ] && [ "${here}" = "open" ]; then
              if [ "${confidential}" = "true" ]; then
                gh issue comment "${number}" -R "${SOURCE}" --body "$(printf \
                  'The confidential source issue was closed.\n\n[Open the confidential source issue](%s)' \
                  "${url}")" >/dev/null
                gh issue close "${number}" -R "${SOURCE}" --reason completed >/dev/null

                echo "closed #${number} (confidential source)"
                closed=$((closed + 1))

                continue
              fi

              comments=$(printf '%s' "${item}" | jq -r '.comments')
              opened=$(printf '%s' "${item}" | jq -r '.opened')
              closed_at=$(printf '%s' "${item}" | jq -r '.closed')

              # Both platforms answer ISO 8601, but with different offsets and
              # fractional seconds -- `date -d` handles either.
              days="?"
              if [ -n "${closed_at}" ]; then
                opened_epoch=$(date -d "${opened}" +%s)
                closed_epoch=$(date -d "${closed_at}" +%s)
                days=$(( (closed_epoch - opened_epoch) / 86400 ))
              fi

              gh issue comment "${number}" -R "${SOURCE}" --body "$(printf \
                'Closed on %s after %s comment(s), %s day(s) open.\n\nThe conversation happened at %s.' \
                "${origin}" "${comments}" "${days}" "${url}")" >/dev/null

              gh issue close "${number}" -R "${SOURCE}" --reason completed >/dev/null

              echo "closed #${number} (source ${url})"
              closed=$((closed + 1))

              continue
            fi

            if [ "${state}" = "open" ] && [ "${here}" = "closed" ]; then
              gh issue reopen "${number}" -R "${SOURCE}" >/dev/null
              if [ "${confidential}" = "true" ]; then
                gh issue comment "${number}" -R "${SOURCE}" --body "$(printf \
                  'The confidential source issue was reopened.\n\n[Open the confidential source issue](%s)' \
                  "${url}")" >/dev/null
              else
                gh issue comment "${number}" -R "${SOURCE}" --body "Reopened on ${origin}: ${url}" >/dev/null
              fi

              echo "reopened #${number} (source ${url})"
              reopened=$((reopened + 1))

              continue
            fi

            untouched=$((untouched + 1))
          done < <(printf '%s' "${foreign}" | jq -c '.[]')

          echo "relay complete: created=${created} issue_bodies_updated=${issue_bodies_updated} comments_created=${comments_created} comments_updated=${comments_updated} comments_removed=${comments_removed} closed=${closed} reopened=${reopened} unchanged=${untouched}"
