name: ClawHub Skills Publish Workflow (compat shim)

# DEPRECATED NAME — kept as a thin pass-through so existing callers that still
# reference `clawhub-skills-publish-workflow.yml@master` keep working. The real
# flow now lives in `clawhub-publish.yml` (skills + plugins). New callers should
# use `clawhub-publish.yml` directly; migrate off this shim when convenient.
#
# This forwards to the local clawhub-publish.yml with plugins OFF, so behaviour
# for skill-only callers is identical to before the rename.

on:
  workflow_call:
    inputs:
      skills_dir:
        required: false
        type: string
        default: ".agents/skills"
      registry:
        required: false
        type: string
        default: "https://clawhub.ai"
      site:
        required: false
        type: string
        default: "https://clawhub.ai"
      tags:
        required: false
        type: string
        default: "latest"
      owner:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      cli_version:
        required: false
        type: string
        default: "0.23.1"
      node_version:
        required: false
        type: string
        default: "22"
      min_release_age_days:
        required: false
        type: number
        default: 7
      dry_run:
        required: false
        type: boolean
        default: false
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      clawhub_token:
        required: true

permissions: {}

jobs:
  forward:
    uses: ./.github/workflows/clawhub-publish.yml
    with:
      publish_skills: true
      publish_plugins: false
      skills_dir: ${{ inputs.skills_dir }}
      registry: ${{ inputs.registry }}
      site: ${{ inputs.site }}
      tags: ${{ inputs.tags }}
      owner: ${{ inputs.owner }}
      version: ${{ inputs.version }}
      cli_version: ${{ inputs.cli_version }}
      node_version: ${{ inputs.node_version }}
      min_release_age_days: ${{ inputs.min_release_age_days }}
      dry_run: ${{ inputs.dry_run }}
      runs_on: ${{ inputs.runs_on }}
    secrets:
      clawhub_token: ${{ secrets.clawhub_token }}
