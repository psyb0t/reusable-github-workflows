name: Archive

# Pushes the caller repo into public archives so it survives the platform it
# lives on. Two targets, two different failure modes:
#
#   Wayback Machine    archives the rendered PAGE (README as HTML, the project
#                      homepage). Good for link rot; useless if you need the code.
#   Software Heritage  archives the GIT OBJECT GRAPH -- every commit and blob,
#                      git-native. This is the one that matters if the host
#                      disappears entirely.
#
# Neither needs an API key. Both are anonymous-friendly and RATE-LIMITED rather
# than gated, which drives the retry policy: every request retries with
# exponential backoff, because the expected failure is "too many requests right
# now", not "no".
#
# If it STILL cannot archive after all of that, the job goes red. A green run
# that archived nothing is a lie, and the point of this job is knowing the
# archive exists. Going red costs nothing here because the job is deliberately
# independent -- nothing `needs:` it, so it reports the truth without blocking
# the release or any other job. That is the split worth keeping: fail honestly,
# but never fail something that had no business being blocked.
#
# Wayback is genuinely slow -- a single save measured ~110s -- so it gets a
# generous per-URL timeout and archives a short list, not every page. A timeout
# is NOT treated as a refusal: Wayback frequently finishes the save after the
# client has given up, so retrying on one is a best-effort second chance rather
# than a correction.

on:
  workflow_call:
    inputs:
      wayback_enabled:
        description: "Archive pages to the Internet Archive's Wayback Machine"
        required: false
        type: boolean
        default: true

      software_heritage_enabled:
        description: "Archive the git history to Software Heritage"
        required: false
        type: boolean
        default: true

      include_homepage:
        description: "Also archive the URL set as this repo's homepage, when it has one"
        required: false
        type: boolean
        default: true

      extra_urls:
        description: "Additional URLs to archive, one per line"
        required: false
        type: string
        default: ""

      capture_outlinks:
        description: "Also archive every page the archived page links to. REQUIRES the archiveorg_access_key / archiveorg_secret_key secrets: outlink capture lives behind the authenticated Save Page Now API, and the keyless path silently ignores the flag rather than refusing it."
        required: false
        type: boolean
        default: true

      capture_screenshot:
        description: "Also store a screenshot of each archived page. Same auth requirement as capture_outlinks."
        required: false
        type: boolean
        default: false

      item_upload_enabled:
        description: "Upload the repository contents to archive.org as an item of its own. Unlike the Wayback save (which keeps the rendered page) and Software Heritage (which keeps the git object graph), this produces a browsable, downloadable copy of the working tree with real metadata attached. Requires the archiveorg key pair."
        required: false
        type: boolean
        default: true

      item_identifier_prefix:
        description: "Prefixed to the repo name to form the archive.org identifier. Identifiers are GLOBAL and permanent -- an unprefixed one is a landgrab that will eventually collide with someone else's project of the same name."
        required: false
        type: string
        default: "psyb0t-"

      max_new_items_per_day:
        description: "Ceiling on how many NEW archive.org items may be created in a day across this account. Creating an item is rate-limited far harder than uploading to one that exists -- a burst answers HTTP 503 SlowDown with 'appears to be spam' -- so past this count the job leaves the rest to the next scheduled run instead of hammering. Counted by asking archive.org, not by keeping a tally: a tally drifts the moment a run dies between uploading and recording it. Deliberately well under the level that tripped the filter (about a dozen inside an hour), because the ceiling is per DAY rather than per hour and the search index it counts from lags by minutes -- so the true burst can exceed this number, and the margin is what absorbs that."
        required: false
        type: number
        default: 5

      item_collection:
        description: "archive.org collection to file the item under. `opensource` is the open self-upload collection; anything else generally has to be granted."
        required: false
        type: string
        default: "opensource"

      fail_on_error:
        description: "Fail the job when an archive request is still refused after every retry. On by default: a green run that archived nothing is a lie, and this job is deliberately independent — nothing `needs:` it, so going red reports the truth without blocking a release or any other job. Set false only if you would rather not see it."
        required: false
        type: boolean
        default: true

      max_attempts:
        description: "Attempts per request before giving up, including the first"
        required: false
        type: number
        default: 5

      backoff_seconds:
        description: "Base delay between attempts, doubling each retry. With the default 5 attempts that is 30s, 60s, 120s, 240s -- about 7 minutes of patience. Sized for the real constraint: an archive.org account gets 3 concurrent Save Page Now sessions, so several repositories archiving at once queue behind each other and answer 429 until one frees up. The old 3 x 10s gave up while the queue was still draining."
        required: false
        type: number
        default: 30

      url_timeout_seconds:
        description: "Per-URL budget for a Wayback save. It is slow; a single save has been measured at ~110s."
        required: false
        type: number
        default: 180

      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      archiveorg_access_key:
        description: "archive.org S3 access key -- an account credential, not a Wayback-only one: the same pair signs Save Page Now, the S3 upload API and the metadata API. Optional; without it the job falls back to the keyless save, which works but cannot capture outlinks or screenshots. Generate at https://archive.org/account/s3.php"
        required: false

      archiveorg_secret_key:
        description: "archive.org S3 secret key, paired with archiveorg_access_key"
        required: false

concurrency:
  group: archive-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  wayback:
    if: inputs.wayback_enabled
    name: Wayback Machine
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Save pages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          INCLUDE_HOMEPAGE: ${{ inputs.include_homepage }}
          EXTRA_URLS: ${{ inputs.extra_urls }}
          CAPTURE_OUTLINKS: ${{ inputs.capture_outlinks }}
          CAPTURE_SCREENSHOT: ${{ inputs.capture_screenshot }}
          FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          BACKOFF: ${{ inputs.backoff_seconds }}
          URL_TIMEOUT: ${{ inputs.url_timeout_seconds }}
          ACCESS_KEY: ${{ secrets.archiveorg_access_key }}
          SECRET_KEY: ${{ secrets.archiveorg_secret_key }}
        run: |
          set -euo pipefail

          # Two ways in, and the difference is not cosmetic:
          #
          #   keyless   GET /save/<url>. Works with no account. Cannot capture
          #             outlinks or screenshots -- it does not refuse those
          #             options, it silently ignores them, which is worse.
          #   keyed     POST /save with an S3-style Authorization header. This is
          #             the Save Page Now v2 API and the ONLY way to get
          #             outlinks. Without the header it answers "You need to be
          #             logged in to use Save Page Now" even for a plain save.
          authed=false
          if [ -n "${ACCESS_KEY}" ] && [ -n "${SECRET_KEY}" ]; then
            authed=true
          fi

          if [ "${CAPTURE_OUTLINKS}" = "true" ] && [ "${authed}" != "true" ]; then
            echo "::warning::capture_outlinks is on but no archive.org keys were provided; outlinks will NOT be captured. Set archiveorg_access_key and archiveorg_secret_key, or turn the input off to silence this."
          fi

          # Returns 0 as soon as a save is confirmed. Retries only what is worth
          # retrying: a 429, a 404, a 5xx, or a timeout. Any other 4xx is the
          # archive telling us the URL itself is unacceptable, and waiting longer
          # will not change that answer.
          #
          # 404 is in the retryable set even though it normally means "gone":
          # Save Page Now answers 404 when it is under load and gives up fetching
          # the target, and the URL passed here is always this repository's own
          # page, which exists. Treating it as terminal made a throttled minute
          # look like a dead link.
          save_with_retry() {
            local url="$1"
            local attempt=1 delay status body

            while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
              if [ "${authed}" = "true" ]; then
                local form=(--data-urlencode "url=${url}")
                if [ "${CAPTURE_OUTLINKS}" = "true" ]; then
                  form+=(--data-urlencode "capture_outlinks=1")
                fi
                if [ "${CAPTURE_SCREENSHOT}" = "true" ]; then
                  form+=(--data-urlencode "capture_screenshot=1")
                fi

                # The response is JSON carrying a job_id. The capture itself is
                # asynchronous, so a job_id IS the success signal here; polling
                # it would only make a best-effort step slower.
                if body=$(curl -sS -w '\n%{http_code}' -X POST \
                  --max-time "${URL_TIMEOUT}" \
                  -H "Accept: application/json" \
                  -H "Authorization: LOW ${ACCESS_KEY}:${SECRET_KEY}" \
                  "${form[@]}" \
                  "https://web.archive.org/save" 2>&1); then

                  status=$(printf '%s' "${body}" | tail -n1)
                  body=$(printf '%s' "${body}" | sed '$d')

                  if [ "${status}" = "200" ]; then
                    local job
                    job=$(printf '%s' "${body}" | jq -r '.job_id // empty' 2>/dev/null || true)

                    if [ -n "${job}" ]; then
                      echo "queued on attempt ${attempt} (job ${job})"

                      return 0
                    fi

                    local refusal
                    refusal=$(printf '%s' "${body}" | jq -r '.status_ext // empty' 2>/dev/null || true)

                    # Save Page Now caps captures PER URL PER DAY (5 at the time
                    # of writing) separately from the account's daily quota.
                    # Hitting it means this page has already been archived
                    # several times today, which is the outcome this job wants --
                    # failing the run over it would report "not archived" about a
                    # URL that is, repeatedly.
                    if [ "${refusal}" = "error:too-many-daily-captures" ]; then
                      echo "::notice::${url} already hit Wayback's per-URL daily capture cap; today's snapshots stand"

                      return 0
                    fi

                    # Any other 200 without a job_id is a refusal in disguise.
                    echo "::warning::Wayback accepted the request but returned no job: ${body}"

                    return 1
                  fi
                else
                  status="000"
                fi
              else
                # -L because /save/ redirects to the snapshot it just created.
                # The body is a full HTML page and carries nothing worth logging.
                if status=$(curl -sL -o /dev/null -w '%{http_code}' \
                  --max-time "${URL_TIMEOUT}" \
                  "https://web.archive.org/save/${url}"); then

                  if [ "${status}" = "200" ]; then
                    echo "archived on attempt ${attempt} (HTTP ${status})"

                    return 0
                  fi
                else
                  status="000"
                fi
              fi

              case "${status}" in
                000)
                  echo "attempt ${attempt}: no answer within ${URL_TIMEOUT}s, retryable"
                  ;;
                404 | 429 | 5*)
                  echo "attempt ${attempt}: HTTP ${status}, retryable"
                  ;;
                *)
                  echo "::warning::Wayback returned HTTP ${status} for ${url}; not retryable"

                  return 1
                  ;;
              esac

              if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
                delay=$((BACKOFF * (2 ** (attempt - 1))))
                echo "waiting ${delay}s before the next attempt"
                sleep "${delay}"
              fi

              attempt=$((attempt + 1))
            done

            echo "::warning::Wayback did not confirm ${url} after ${MAX_ATTEMPTS} attempt(s); the save may still complete on their side"

            return 1
          }

          urls=("https://github.com/${SOURCE}")

          if [ "${INCLUDE_HOMEPAGE}" = "true" ]; then
            homepage=$(gh api "repos/${SOURCE}" --jq '.homepage // ""')
            if [ -n "${homepage}" ]; then
              urls+=("${homepage}")
            fi
          fi

          while IFS= read -r extra; do
            [ -n "${extra}" ] || continue
            urls+=("${extra}")
          done <<< "${EXTRA_URLS}"

          failed=0

          for url in "${urls[@]}"; do
            echo "::group::${url}"

            if ! save_with_retry "${url}"; then
              failed=$((failed + 1))
            fi

            echo "::endgroup::"
          done

          echo "requested ${#urls[@]} page(s), ${failed} did not confirm"

          if [ "${FAIL_ON_ERROR}" = "true" ] && [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} page(s) were not archived and fail_on_error is true" >&2
            exit 1
          fi

  software-heritage:
    if: inputs.software_heritage_enabled
    name: Software Heritage
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Save code now
        env:
          SOURCE: ${{ github.repository }}
          FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          BACKOFF: ${{ inputs.backoff_seconds }}
        run: |
          set -euo pipefail

          origin="https://github.com/${SOURCE}"
          endpoint="https://archive.softwareheritage.org/api/1/origin/save/git/url/${origin}/"

          attempt=1
          accepted=false

          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            # Status and body together: curl exits 0 on a 4xx/5xx, so `set -e`
            # would not catch a refusal and the step would go green having
            # archived nothing. The status decides whether to retry; the body
            # explains what happened.
            response=$(curl -sS -w '\n%{http_code}' -X POST "${endpoint}" 2>&1 || true)
            status=$(printf '%s' "${response}" | tail -n1)
            body=$(printf '%s' "${response}" | sed '$d')

            if [ "${status}" = "200" ]; then
              request=$(printf '%s' "${body}" | jq -r '.save_request_status // "unknown"')
              task=$(printf '%s' "${body}" | jq -r '.save_task_status // "unknown"')

              echo "save_request_status=${request} save_task_status=${task}"

              # The archive runs asynchronously, so "accepted" + "pending" is
              # the normal success shape, not a partial result to poll for.
              if [ "${request}" = "accepted" ]; then
                accepted=true

                break
              fi

              echo "::warning::Software Heritage did not accept the request (${request})"

              break
            fi

            case "${status}" in
              429 | 5*)
                echo "attempt ${attempt}: HTTP ${status}, retryable"
                ;;
              *)
                echo "::warning::Software Heritage returned HTTP ${status}: ${body}"

                break
                ;;
            esac

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              delay=$((BACKOFF * (2 ** (attempt - 1))))
              echo "waiting ${delay}s before the next attempt"
              sleep "${delay}"
            fi

            attempt=$((attempt + 1))
          done

          if [ "${accepted}" != "true" ]; then
            echo "::warning::Software Heritage did not accept ${origin} after ${MAX_ATTEMPTS} attempt(s)"

            if [ "${FAIL_ON_ERROR}" = "true" ]; then
              echo "::error::Software Heritage save failed and fail_on_error is true" >&2
              exit 1
            fi
          fi

  internet-archive-item:
    if: inputs.item_upload_enabled
    name: archive.org item
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Check out the working tree
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Upload the repository as an item
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.repository }}
          REPO: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
          PREFIX: ${{ inputs.item_identifier_prefix }}
          COLLECTION: ${{ inputs.item_collection }}
          MAX_NEW_PER_DAY: ${{ inputs.max_new_items_per_day }}
          PREFIX_QUERY: ${{ inputs.item_identifier_prefix }}
          COMMIT: ${{ github.sha }}
          FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          BACKOFF: ${{ inputs.backoff_seconds }}
          ACCESS_KEY: ${{ secrets.archiveorg_access_key }}
          SECRET_KEY: ${{ secrets.archiveorg_secret_key }}
        run: |
          set -euo pipefail

          if [ -z "${ACCESS_KEY}" ] || [ -z "${SECRET_KEY}" ]; then
            echo "::warning::no archive.org key pair; skipping the item upload"

            exit 0
          fi

          identifier="${PREFIX}${REPO}"
          echo "item: https://archive.org/details/${identifier}"

          # The item's own metadata is the record of what was last uploaded, so
          # there is nothing to keep in sync and nothing to go stale. A run that
          # died mid-upload never wrote its revision, so the next run sees a
          # mismatch and retries -- the ABSENCE of the revision is the failure
          # record, which is why no separate retry flag exists.
          state=$(curl -sS "https://archive.org/metadata/${identifier}" || echo '{}')
          item_exists=$(printf '%s' "${state}" | jq -r 'if (.metadata // empty) then "yes" else "no" end')
          uploaded_rev=$(printf '%s' "${state}" | jq -r '.metadata.sourcerevision // empty')

          if [ "${uploaded_rev}" = "${COMMIT}" ]; then
            echo "item already holds ${COMMIT}; nothing to upload"

            exit 0
          fi

          # Only CREATION is throttled; uploading to an item that already exists
          # is an ordinary PUT, so the budget gates the create path alone.
          if [ "${item_exists}" != "yes" ]; then
            today=$(date -u +%Y-%m-%d)
            created_today=$(curl -sS --get "https://archive.org/advancedsearch.php" \
              --data-urlencode "q=identifier:${PREFIX_QUERY}*" \
              --data-urlencode "fl[]=addeddate" \
              --data-urlencode "rows=500" \
              --data-urlencode "output=json" \
              | jq -r --arg d "${today}" \
                '[.response.docs[]? | select((.addeddate // "") | startswith($d))] | length' \
              || echo 0)

            echo "${created_today} item(s) created today, ceiling is ${MAX_NEW_PER_DAY}"

            # The search index lags by minutes, so this is a guard rail and not
            # an exact count. Green, not red: there is nothing wrong here, the
            # work simply belongs to a later run.
            if [ "${created_today}" -ge "${MAX_NEW_PER_DAY}" ]; then
              echo "::notice::daily new-item ceiling reached; leaving ${identifier} to the next scheduled run"

              exit 0
            fi
          fi

          # One tarball rather than a file-per-request: a repo of any size would
          # otherwise be hundreds of round trips, and archive.org unpacks the
          # archive on its side into a browsable listing anyway.
          tarball="${identifier}-${REF//\//-}.tar.gz"
          tar --exclude-vcs -czf "/tmp/${tarball}" .
          size=$(stat -c%s "/tmp/${tarball}")
          echo "packed ${size} bytes as ${tarball}"

          meta=$(gh api "repos/${SOURCE}" --jq '{
            description: (.description // ""),
            homepage: (.homepage // ""),
            topics: (.topics // []),
            license: (.license.spdx_id // ""),
            language: (.language // "")
          }')

          description=$(printf '%s' "${meta}" | jq -r '.description')
          homepage=$(printf '%s' "${meta}" | jq -r '.homepage')
          license=$(printf '%s' "${meta}" | jq -r '.license')

          # The links are the point: an item nobody can trace back to a live
          # project is a tarball with no context. Source always, project page
          # when the repo has one.
          long_description="Source: https://github.com/${SOURCE}"
          if [ -n "${homepage}" ]; then
            long_description="${long_description}<br>Project page: ${homepage}"
          fi
          if [ -n "${description}" ]; then
            long_description="${description}<br><br>${long_description}"
          fi

          headers=(
            -H "Authorization: LOW ${ACCESS_KEY}:${SECRET_KEY}"
            -H "x-amz-auto-make-bucket:1"
            -H "x-archive-meta-mediatype:software"
            -H "x-archive-meta-collection:${COLLECTION}"
            -H "x-archive-meta-title:${SOURCE}"
            -H "x-archive-meta-creator:${GITHUB_REPOSITORY_OWNER}"
            -H "x-archive-meta-description:${long_description}"
            -H "x-archive-meta-originalurl:https://github.com/${SOURCE}"
            # Tells archive.org to unpack the tarball into the item, so the item
            # page shows the actual directory rather than one opaque blob.
            -H "x-archive-queue-derive:1"
            -H "x-archive-extract-files:1"
          )

          if [ -n "${homepage}" ]; then
            headers+=(-H "x-archive-meta-homepage:${homepage}")
          fi

          # Both, because they serve different readers. archive.org renders
          # licenseurl under the heading "Usage" and only prettifies licences it
          # knows -- effectively the Creative Commons set -- so an SPDX link
          # shows up as a bare URL. `rights` carries the name a person reads;
          # `licenseurl` carries the identifier a machine resolves.
          if [ -n "${license}" ] && [ "${license}" != "NOASSERTION" ]; then
            headers+=(-H "x-archive-meta-licenseurl:https://spdx.org/licenses/${license}.html")
            # ASCII only: header values are latin-1 at best, and a stray em dash
            # is either rejected or silently mangled on the way through.
            headers+=(-H "x-archive-meta-rights:${license} License. See https://spdx.org/licenses/${license}.html")
          fi

          # Subject headers are numbered, not repeated: a plain repeat overwrites
          # rather than appends, so all but the last topic would vanish.
          index=0
          while IFS= read -r topic; do
            [ -n "${topic}" ] || continue
            headers+=(-H "x-archive-meta${index}-subject:${topic}")
            index=$((index + 1))
          done < <(printf '%s' "${meta}" | jq -r '.topics[]')

          attempt=1
          while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
            if status=$(curl -sS -o /tmp/ia-response -w '%{http_code}' \
              --retry 0 -X PUT "${headers[@]}" \
              --upload-file "/tmp/${tarball}" \
              "https://s3.us.archive.org/${identifier}/${tarball}"); then

              if [ "${status}" = "200" ]; then
                echo "uploaded on attempt ${attempt}"
                echo "https://archive.org/details/${identifier}" >> "${GITHUB_STEP_SUMMARY}"

                # The x-archive-meta-* headers above are honoured ONLY when the
                # item is created. On every later upload they are accepted and
                # ignored, so without this the description, topics and licence
                # would be frozen at whatever they were the day the item first
                # went up. The metadata API is the only way to move them after
                # that, so it runs every time rather than only on changes --
                # cheaper than working out whether anything drifted.
                patch=$(jq -nc \
                  --arg title "${SOURCE}" \
                  --arg desc "${long_description}" \
                  --arg orig "https://github.com/${SOURCE}" \
                  --argjson subjects "$(printf '%s' "${meta}" | jq -c '.topics')" \
                  --arg rev "${COMMIT}" \
                  '[
                    {op: "add", path: "/title",       value: $title},
                    {op: "add", path: "/description", value: $desc},
                    {op: "add", path: "/originalurl", value: $orig},
                    {op: "add", path: "/subject",     value: $subjects},
                    {op: "add", path: "/sourcerevision", value: $rev}
                  ]')

                if [ -n "${homepage}" ]; then
                  patch=$(printf '%s' "${patch}" | jq -c --arg h "${homepage}" \
                    '. + [{op: "add", path: "/homepage", value: $h}]')
                fi

                if [ -n "${license}" ] && [ "${license}" != "NOASSERTION" ]; then
                  patch=$(printf '%s' "${patch}" | jq -c --arg l "${license}" '
                    . + [
                      {op: "add", path: "/licenseurl",
                       value: ("https://spdx.org/licenses/" + $l + ".html")},
                      {op: "add", path: "/rights",
                       value: ($l + " License. See https://spdx.org/licenses/" + $l + ".html")}
                    ]')
                fi

                # Body on stdin, never on the command line: the keys would
                # otherwise sit in this process's argv for anything on the
                # runner to read.
                if meta_out=$(printf 'target=metadata&patch=%s&access=%s&secret=%s' \
                  "$(jq -rn --arg v "${patch}" '$v|@uri')" "${ACCESS_KEY}" "${SECRET_KEY}" \
                  | curl -sS -X POST --data @- "https://archive.org/metadata/${identifier}"); then

                  if printf '%s' "${meta_out}" | jq -e '.success' >/dev/null 2>&1; then
                    echo "metadata synced"
                  else
                    echo "::warning::metadata sync refused: ${meta_out}"
                  fi
                else
                  echo "::warning::metadata sync request failed"
                fi

                exit 0
              fi
            else
              status="000"
            fi

            echo "attempt ${attempt}: HTTP ${status}"
            head -c 400 /tmp/ia-response || true
            echo

            case "${status}" in
              000 | 429 | 5*)
                ;;
              *)
                echo "::warning::archive.org refused the upload with HTTP ${status}; not retryable"

                break
                ;;
            esac

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              delay=$((BACKOFF * (2 ** (attempt - 1))))
              echo "waiting ${delay}s before the next attempt"
              sleep "${delay}"
            fi

            attempt=$((attempt + 1))
          done

          if [ "${FAIL_ON_ERROR}" = "true" ]; then
            echo "::error::the archive.org item upload did not succeed" >&2
            exit 1
          fi
