name: mirror

# Deliberately NOT named git-mirror.yml: that filename is taken by the reusable
# workflow definition this repo publishes. This is the caller that mirrors this
# repo itself, and the two cannot share a name.
#
# Without it the repo looked mirrored to any check that only asked "is there a
# git-mirror.yml here" -- there is, but it is a workflow_call definition that
# never fires on a push, so nothing was ever pushed to GitLab.
on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    uses: psyb0t/reusable-github-workflows/.github/workflows/git-mirror.yml@master
    with:
      gitlab_enabled: true
      # Gitee is off: it requires a mobile number bound to the account before
      # any repository can be public, and rather than refusing it creates the
      # repo private, so the mirror runs green while nobody can see it. Turn it
      # back on once the account is verified.
      gitee_enabled: false
    secrets:
      gitlab_token: ${{ secrets.GITLAB_TOKEN }}
