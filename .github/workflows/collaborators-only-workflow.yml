name: Collaborators Only Workflow

# Caller MUST trigger this with `on: pull_request_target` (not pull_request)
# so the token has permission to comment/close PRs from forks.
# Example caller workflow:
#
#   on:
#     pull_request_target:
#       types: [opened, reopened]
#   jobs:
#     gate:
#       uses: psyb0t/reusable-github-workflows/.github/workflows/collaborators-only-workflow.yml@<sha>

on:
  workflow_call:
    inputs:
      close_message:
        description: "Message to post when closing unauthorized PRs"
        required: false
        default: "This repository does not accept external pull requests. Please open an issue instead."
        type: string
      lock:
        description: "Lock the PR conversation after closing"
        required: false
        default: true
        type: boolean
      allow_authors:
        description: "Comma-separated PR author logins that bypass the collaborator check -- trusted bots whose PRs should stay open to be reviewed and merged (never auto-closed). Defaults to Dependabot."
        required: false
        default: "dependabot[bot],dependabot-preview[bot]"
        type: string

concurrency:
  group: collaborators-only-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-collaborator:
    name: Check Collaborator
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close PR if author is not a collaborator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CLOSE_MESSAGE: ${{ inputs.close_message }}
          LOCK_PR: ${{ inputs.lock }}
          ALLOW_AUTHORS: ${{ inputs.allow_authors }}
        run: |
          set -euo pipefail

          # Trusted-author allow-list (e.g. Dependabot): these PRs are meant to
          # be reviewed and merged, so never auto-close them. Closing them is
          # also a dead notification path -- a bot-opened, bot-closed PR pings
          # nobody, so it would silently disappear into the Closed tab.
          IFS=',' read -ra ALLOWED <<< "${ALLOW_AUTHORS:-}"
          for a in "${ALLOWED[@]}"; do
            a="${a//[[:space:]]/}"
            if [ -n "$a" ] && [ "$AUTHOR" = "$a" ]; then
              echo "${AUTHOR} is on the allow-list — leaving PR open"
              exit 0
            fi
          done

          # 204 = collaborator, 404 = not collaborator, anything else = bail.
          status=$(gh api -i "repos/${REPO}/collaborators/${AUTHOR}" 2>/dev/null \
            | head -n1 | awk '{print $2}' || true)

          if [ "$status" = "204" ]; then
            echo "${AUTHOR} is a collaborator — allowing PR"
            exit 0
          fi

          if [ "$status" != "404" ]; then
            echo "Unexpected status ${status} from collaborator check" >&2
            exit 1
          fi

          echo "${AUTHOR} is not a collaborator — closing PR"

          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${CLOSE_MESSAGE}"
          gh pr close "${PR_NUMBER}" --repo "${REPO}"

          if [ "${LOCK_PR}" = "true" ]; then
            gh pr lock "${PR_NUMBER}" --repo "${REPO}"
          fi
