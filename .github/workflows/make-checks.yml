name: Make Checks

# DEPRECATED: superseded by code-workflow.yml, which does the same command
# chaining plus a build gate, sec + SARIF upload, and codegen-drift checking.
# Kept working for existing callers; it will be removed in a later release once
# they migrate. New pipelines should use code-workflow.yml.
#
# Lint and test for repos whose toolchain lives in their own container rather
# than on the runner -- typically the ones that ship a Docker image. There is no
# setup-go / setup-python step here on purpose: the runner already has a Docker
# daemon, and the repo's Makefile owns everything past that.
#
# Call this as its own job and gate the build on it (`needs: [checks]`). Folding
# the same commands into docker-image-workflow.yml as extra steps looks simpler
# but is not: every build job there is gated to master/main/tags, so the checks
# would only ever run at the moment you are already publishing, never on a
# feature branch.

on:
  workflow_call:
    inputs:
      lint_command:
        description: "Lint command. Empty or '-' skips the step."
        type: string
        required: false
        default: "make lint"
      test_command:
        description: "Test command. Empty or '-' skips the step."
        type: string
        required: false
        default: "make test"
      dep_command:
        description: >-
          Dependency setup, run before lint and test. Empty or '-' skips it.
          Off by default: when the toolchain lives in a container, the
          dependency env is built inside that container and cannot be handed to
          a later step on the host.
        type: string
        required: false
        default: ""
      coverage_file:
        description: >-
          Path to the coverage file produced by test_command. Set it and the
          file is uploaded as an artifact for create-badges.yml to read; leave
          it empty and no artifact is uploaded.
        type: string
        required: false
        default: ""
      coverage_artifact:
        description: "Artifact name for coverage_file. Must match what create-badges.yml downloads."
        type: string
        required: false
        default: "coverage"
      runs_on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"

# The group is namespaced rather than the bare `${{ github.workflow }}-${{ github.ref }}`
# the language workflows use, because that expression evaluates in the CALLER's
# context: called from the same pipeline as docker-image-workflow.yml, both
# would resolve to one identical group and cancel each other on a branch push.
# `needs:` normally keeps them from overlapping, but the guard should not depend
# on the caller remembering that edge.
concurrency:
  group: make-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  # One job, not a lint job plus a test job. Splitting them would run in
  # parallel, but each runner would build the repo's dev image from scratch --
  # there is no layer cache shared between them -- so the dominant cost gets
  # paid twice to save a step that is usually seconds.
  checks:
    name: Checks
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup dependencies
        if: inputs.dep_command != '' && inputs.dep_command != '-'
        run: ${{ inputs.dep_command }}

      - name: Lint
        if: inputs.lint_command != '' && inputs.lint_command != '-'
        run: ${{ inputs.lint_command }}

      - name: Test
        if: inputs.test_command != '' && inputs.test_command != '-'
        run: ${{ inputs.test_command }}

      # retention-days: 1 because the only consumer is the badges job in the
      # same run.
      - name: Upload coverage artifact
        if: inputs.coverage_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.coverage_artifact }}
          path: ${{ inputs.coverage_file }}
          if-no-files-found: error
          retention-days: 1
