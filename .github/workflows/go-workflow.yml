name: Go Workflow

# SECURITY: `test_command`, `lint_command`, `dep_command` and
# `generate_command` are interpolated directly into shell scripts. Callers
# control these strings and effectively get arbitrary code execution on the
# runner with whatever secrets/permissions the caller workflow grants. Only
# call this workflow from trusted repos with branch protection on the workflow
# files.
#
# DISABLING A STEP: any *_command accepts "-" (preferred) or "" to mean "skip
# this entirely". "-" is the documented form because an empty string in a
# caller's YAML is indistinguishable from a templating accident, while "-"
# reads as a deliberate opt-out.

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to use"
        required: false
        default: "1.26"
        type: string
      test_command:
        description: "Command to run tests"
        required: false
        default: "make test"
        type: string
      lint_command:
        description: "Command to run linting"
        required: false
        default: "make lint"
        type: string
      dep_command:
        description: "Command to download dependencies. Set to '-' to skip it everywhere."
        required: false
        default: "make dep"
        type: string
      generate_command:
        description: "Command that regenerates committed generated files. The tree must be unchanged afterwards. Set to '-' to skip the codegen-drift job."
        required: false
        default: "make generate"
        type: string
      is_vendored:
        description: "Whether dependencies are vendored (skips dep_command)"
        required: false
        default: false
        type: boolean
      coverage_file:
        description: "If set, upload this file (produced by test_command, containing the coverage percentage) as an artifact so a downstream badge job can read it"
        required: false
        default: ""
        type: string
      coverage_artifact:
        description: "Name of the uploaded coverage artifact"
        required: false
        default: "coverage"
        type: string
      scan_enabled:
        description: "Enable govulncheck dependency vulnerability scan"
        required: false
        default: true
        type: boolean
      runs_on:
        description: "Runner to use (e.g. ubuntu-latest, self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
      debug:
        description: "Debug workflow"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  debug-workflow:
    name: Debug Info
    runs-on: ${{ inputs.runs_on }}
    permissions: {}
    if: inputs.debug
    steps:
      - name: Debug GitHub context
        run: |
          echo "::group::GitHub Context"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.sha: ${{ github.sha }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.run_number: ${{ github.run_number }}"
          echo "github.run_attempt: ${{ github.run_attempt }}"
          echo "github.actor: ${{ github.actor }}"
          echo "github.repository: ${{ github.repository }}"
          echo "::endgroup::"

          echo "::group::Inputs"
          echo "go_version: ${{ inputs.go_version }}"
          echo "test_command: ${{ inputs.test_command }}"
          echo "lint_command: ${{ inputs.lint_command }}"
          echo "dep_command: ${{ inputs.dep_command }}"
          echo "generate_command: ${{ inputs.generate_command }}"
          echo "is_vendored: ${{ inputs.is_vendored }}"
          echo "::endgroup::"

  code-checks:
    name: Code Checks
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    if: inputs.lint_command != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Setup dependencies
        if: ${{ !inputs.is_vendored && inputs.dep_command != '' && inputs.dep_command != '-' }}
        run: ${{ inputs.dep_command }}

      - name: Run code checks
        run: ${{ inputs.lint_command }}

  test:
    name: Test
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    if: inputs.test_command != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Setup dependencies
        if: ${{ !inputs.is_vendored && inputs.dep_command != '' && inputs.dep_command != '-' }}
        run: ${{ inputs.dep_command }}

      - name: Run tests
        run: |
          echo "Running: ${{ inputs.test_command }}"
          ${{ inputs.test_command }}

      - name: Upload coverage artifact
        if: inputs.coverage_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.coverage_artifact }}
          path: ${{ inputs.coverage_file }}
          if-no-files-found: error
          retention-days: 1

  # Codegen drift: a committed generated file that no longer matches what the
  # generator produces from the current sources. Both directions are silent —
  # a source change whose generator was never re-run ships stale output, and a
  # hand-edit to a generated file survives until the next person regenerates
  # and wipes it. Neither breaks the build, so only a diff catches them.
  #
  # Generation must be idempotent for this to work. A generator that stamps a
  # timestamp, a hostname, or iterates a map in random order will fail here on
  # every run; pin the generator version (e.g. the go.mod `tool` block) rather
  # than disabling the job.
  generate-check:
    name: Codegen Drift
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    if: inputs.generate_command != '' && inputs.generate_command != '-'
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Setup dependencies
        if: ${{ !inputs.is_vendored && inputs.dep_command != '' && inputs.dep_command != '-' }}
        run: ${{ inputs.dep_command }}

      - name: Run generators
        run: ${{ inputs.generate_command }}

      # `git status --porcelain` rather than `git diff --exit-code`: diff only
      # sees tracked files, so a generator emitting a NEW file that nobody
      # committed would pass silently. Porcelain catches modified and untracked
      # alike, and still ignores anything in .gitignore.
      - name: Fail if generated files drifted
        run: |
          changes="$(git status --porcelain)"
          if [ -z "${changes}" ]; then
            echo "Generated files are up to date."
            exit 0
          fi

          echo "::error::Generated files are out of date. Run the generator locally and commit the result."
          echo "::group::Changed paths"
          echo "${changes}"
          echo "::endgroup::"
          echo "::group::Diff"
          git diff
          echo "::endgroup::"
          exit 1

  security-scan:
    name: Security Scan
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    if: inputs.scan_enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Setup dependencies
        if: ${{ !inputs.is_vendored && inputs.dep_command != '' && inputs.dep_command != '-' }}
        run: ${{ inputs.dep_command }}

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  release:
    name: GitHub Release
    runs-on: ${{ inputs.runs_on }}
    needs: [code-checks, test, generate-check, security-scan]
    if: always() && contains(github.ref, 'refs/tags/') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.code-checks.result == 'success' || needs.code-checks.result == 'skipped') && (needs.generate-check.result == 'success' || needs.generate-check.result == 'skipped') && (!inputs.scan_enabled || needs.security-scan.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Generate changelog and classify release
        id: changelog
        run: |
          tag_name=${GITHUB_REF#refs/tags/}
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

          if echo "$tag_name" | grep -qiE '(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            prev_tag=$(git describe --tags --abbrev=0 HEAD^)
            echo "## Changes in ${tag_name}" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"* %s (%h)" "${prev_tag}..HEAD" >> CHANGELOG.md
          else
            echo "## Initial Release ${tag_name}" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "First release of this project." >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: Release ${{ steps.changelog.outputs.tag_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.changelog.outputs.is_prerelease == 'true' }}
          files: ""
          generate_release_notes: true
          make_latest: ${{ steps.changelog.outputs.is_prerelease != 'true' }}
